<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algorithmic Ecosystem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@800;900&display=swap');

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    overflow:hidden;
    background: #03050f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
  }

  canvas#c {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, rgba(40,70,110,0.08) 0%, rgba(3,5,15,1) 100%);
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  /* Light rays WebGL container — sits above scene, below text */
  .light-rays-container {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .light-rays-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    pointer-events: none;
    gap: 0;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: rgba(118,215,255,0.6);
    margin-bottom: 36px;
    opacity: 0;
  }

  h1 {
    font-family: 'Balgio', sans-serif;
    font-weight: normal;
    font-size: clamp(20px, 3.6vw, 52px);
    text-align: center;
    line-height: 1.1;
    letter-spacing: 0.01em;
    opacity: 1;
  }
  h1 .line1 { display: block; }
  h1 .line2 {
    color: #ffffff;
    display: block;
    margin-top: 0.05em;
  }
  h1 .line2-blue {
    color: rgba(118,215,255,0.9) !important;
  }

  .sub {
    margin-top: 18px;
    font-size: clamp(13px, 1.5vw, 17px);
    color: rgba(255,255,255,0.95);
    text-align: center;
    max-width: 480px;
    line-height: 1.7;
    padding: 0 24px;
    font-weight: 400;
    opacity: 0;
  }

  .rule {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(118,215,255,0.35), transparent);
    margin: 30px 0;
  }

  /* ── JELLO BUTTON ── */
  .Btn {
    pointer-events: auto;
    position: relative;
    width: 280px;
    height: 68px;
    border-radius: 45px;
    border: none;
    background-color: rgb(151, 95, 255);
    color: white;
    box-shadow: 0px 10px 10px rgb(210, 187, 253) inset,
    0px 5px 10px rgba(5, 5, 5, 0.212),
    0px -10px 10px rgb(124, 54, 255) inset;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
  }
  .Btn::before {
    width: 70%;
    height: 2px;
    position: absolute;
    background-color: rgba(250, 250, 250, 0.678);
    content: "";
    filter: blur(1px);
    top: 7px;
    border-radius: 50%;
  }
  .Btn::after {
    width: 70%;
    height: 2px;
    position: absolute;
    background-color: rgba(250, 250, 250, 0.137);
    content: "";
    filter: blur(1px);
    bottom: 7px;
    border-radius: 50%;
  }
  .Btn:hover {
    animation: jello-horizontal 0.9s both;
  }
  @keyframes jello-horizontal {
    0%   { transform: scale3d(1, 1, 1); }
    30%  { transform: scale3d(1.25, 0.75, 1); }
    40%  { transform: scale3d(0.75, 1.25, 1); }
    50%  { transform: scale3d(1.15, 0.85, 1); }
    65%  { transform: scale3d(0.95, 1.05, 1); }
    75%  { transform: scale3d(1.05, 0.95, 1); }
    100% { transform: scale3d(1, 1, 1); }
  }

  .hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.16);
    z-index: 1000;
    opacity: 0;
  }

  /* ── WAVE CARD ── */
  .card-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    opacity: 1;
    transition: opacity 0.8s ease;
    background: rgba(3,5,15,0.65);
  }
  .card-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ── SUBMARINE PORTHOLE — circle ── */
  .card {
    width: 580px;
    height: 580px;
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    transition: all .4s ease;

    background: radial-gradient(circle at 32% 28%,
      #6a7280 0%,
      #42484f 20%,
      #28292e 50%,
      #1c1e22 100%
    );

    box-shadow:
      0 0 90px rgba(0,120,200,0.18),
      0 30px 90px rgba(0,0,0,0.9),
      inset 5px 5px 16px rgba(255,255,255,0.07),
      inset -5px -5px 16px rgba(0,0,0,0.65);
  }

  .card:hover {
    box-shadow:
      0 0 120px rgba(0,160,255,0.3),
      0 0 240px rgba(0,100,200,0.13),
      0 30px 90px rgba(0,0,0,0.9),
      inset 5px 5px 16px rgba(255,255,255,0.09),
      inset -5px -5px 16px rgba(0,0,0,0.65);
  }

  /* frame groove rings */
  .card::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 3px solid rgba(50,58,66,0.9);
    box-shadow:
      0 0 0 5px rgba(26,30,34,0.95),
      0 0 0 9px rgba(50,58,66,0.8),
      0 0 0 13px rgba(20,24,28,0.9);
    pointer-events: none;
    z-index: 5;
  }

  /* inner glass seal ring */
  .card::after {
    content: '';
    position: absolute;
    inset: 38px;
    border-radius: 50%;
    border: 2px solid rgba(70,95,115,0.3);
    box-shadow:
      inset 0 2px 10px rgba(0,0,0,0.85),
      0 0 0 1px rgba(35,52,68,0.45);
    pointer-events: none;
    z-index: 5;
  }

  .card2 {
    position: absolute;
    inset: 42px;
    border-radius: 50%;
    transition: all .3s ease;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
    gap: 14px;
    box-sizing: border-box;
    text-align: center;
    overflow: hidden;

    background: radial-gradient(ellipse at 50% 120%,
      rgba(0,65,105,0.55) 0%,
      rgba(0,18,42,0.96) 50%,
      rgba(0,4,14,1) 100%
    );

    box-shadow:
      inset 0 1px 0 rgba(150,215,255,0.05),
      inset 0 -2px 10px rgba(0,0,0,0.6);
  }

  /* glass sheen top-left */
  .card2::before {
    content: '';
    position: absolute;
    top: 8%;
    left: 10%;
    width: 32%;
    height: 20%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(200,235,255,0.065) 0%, transparent 70%);
    transform: rotate(-25deg);
    pointer-events: none;
    z-index: 6;
  }

  /* edge vignette */
  .card2::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,4,14,0.78) 100%);
    pointer-events: none;
    z-index: 6;
  }

  .card2:hover { transform: scale(0.997); }

  #plankton-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
    z-index: 2;
  }
  .card:hover #plankton-canvas { opacity: 1; }

  .card2 .card-title {
    font-family: 'Balgio', sans-serif;
    font-size: clamp(48px, 7vw, 72px);
    font-weight: normal;
    color: rgba(255,255,255,1);
    letter-spacing: 0.04em;
    line-height: 1;
    position: relative;
    z-index: 7;
    text-shadow: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .card2 .card-body {
    font-size: 16px;
    font-weight: 500;
    color: rgba(180,225,245,0.88);
    line-height: 1.7;
    max-width: 340px;
    position: relative;
    z-index: 7;
    opacity: 0;
    transform: translateY(8px);
    letter-spacing: 0.02em;
    text-shadow: 0 0 18px rgba(80,180,255,0.35);
    transition: opacity 0.4s ease 0.08s, transform 0.4s ease 0.08s;
  }

  .card2 .card-cta {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.35em;
    -webkit-text-stroke: 0.3px rgba(118,215,255,0.8);
    text-transform: uppercase;
    color: rgba(118,215,255,1);
    margin-top: 10px;
    padding: 13px 32px;
    border: 2px solid rgba(118,215,255,0.55);
    border-radius: 30px;
    background: rgba(0,120,200,0.18);
    backdrop-filter: blur(4px);
    position: relative;
    z-index: 7;
    opacity: 0;
    transform: translateY(8px);
    text-shadow: 0 0 14px rgba(118,215,255,0.9), 0 0 30px rgba(80,180,255,0.5);
    box-shadow: 0 0 18px rgba(0,160,255,0.18), inset 0 0 10px rgba(0,160,255,0.06);
    transition: opacity 0.4s ease 0.16s, transform 0.4s ease 0.16s;
    animation: ctaPulse 2.4s ease-in-out infinite;
  }

  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 0 18px rgba(0,160,255,0.18), inset 0 0 10px rgba(0,160,255,0.06); border-color: rgba(118,215,255,0.55); }
    50%       { box-shadow: 0 0 32px rgba(0,180,255,0.38), inset 0 0 16px rgba(0,180,255,0.12); border-color: rgba(118,215,255,1); }
  }

  .cursor-blink {
    display: inline-block;
    color: rgba(118,215,255,0.9);
    font-weight: 300;
    margin-left: 1px;
    opacity: 0;
    animation: blinkCursor 0.75s step-end infinite;
  }
  .cursor-blink.active { opacity: 1; }
  @keyframes blinkCursor {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
  .card:hover .card2 .card-title,
  .card:hover .card2 .card-body,
  .card:hover .card2 .card-cta {
    opacity: 1;
    transform: translateY(0);
  }

  .rivet {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 33% 28%, #72808c, #252c33);
    box-shadow:
      inset 1px 1px 2px rgba(255,255,255,0.18),
      inset -1px -1px 2px rgba(0,0,0,0.65),
      0 1px 3px rgba(0,0,0,0.7);
    z-index: 10;
    pointer-events: none;
  }

  /* demo cursor triggers same reveal as real hover */
  .card.demo-hover .card2 .card-title,
  .card.demo-hover .card2 .card-body,
  .card.demo-hover .card2 .card-cta {
    opacity: 1;
    transform: translateY(0);
  }
  .card.demo-hover #plankton-canvas { opacity: 1; }
  .card.demo-hover {
    box-shadow:
      0 0 120px rgba(0,160,255,0.3),
      0 0 240px rgba(0,100,200,0.13),
      0 30px 90px rgba(0,0,0,0.9),
      inset 5px 5px 16px rgba(255,255,255,0.09),
      inset -5px -5px 16px rgba(0,0,0,0.65);
  }

  /* ── WHIRLPOOL TRANSITION ── */
  .whirlpool-overlay {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2000;
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .whirlpool-overlay::before {
    content: '';
    position: absolute;
    width: 140vmax;
    height: 140vmax;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      transparent 0%,
      rgba(118, 215, 255, 0.55) 6%,
      transparent 12%,
      rgba(255, 255, 255, 0.45) 22%,
      transparent 28%,
      rgba(118, 215, 255, 0.6)  44%,
      transparent 50%,
      rgba(255, 255, 255, 0.5)  64%,
      transparent 70%,
      rgba(118, 215, 255, 0.5)  82%,
      transparent 88%,
      rgba(255, 255, 255, 0.4)  96%,
      transparent 100%
    );
    filter: blur(3px);
    transform: scale(0) rotate(0deg);
    mix-blend-mode: screen;
  }
  .whirlpool-overlay::after {
    content: '';
    position: absolute;
    width: 100vmax;
    height: 100vmax;
    border-radius: 50%;
    background: radial-gradient(circle at center,
      rgba(0,0,5,0.95) 0%,
      rgba(0,0,5,0.6)  15%,
      transparent      35%);
    transform: scale(0);
  }
  .whirlpool-overlay.active { opacity: 1; }
  .whirlpool-overlay.active::before {
    animation: whirlpool-spin 1.8s cubic-bezier(0.4, 0, 0.7, 1) forwards;
  }
  .whirlpool-overlay.active::after {
    animation: whirlpool-darken 1.8s cubic-bezier(0.4, 0, 0.7, 1) forwards;
  }
  @keyframes whirlpool-spin {
    0%   { transform: scale(0)   rotate(0deg);    opacity: 0; }
    15%  { opacity: 1; }
    100% { transform: scale(3.5) rotate(1440deg); opacity: 1; }
  }
  @keyframes whirlpool-darken {
    0%   { transform: scale(0);   opacity: 0; }
    60%  { opacity: 1; }
    100% { transform: scale(4);   opacity: 1; }
  }

  /* Scene gets sucked into the vortex */
  body.whirlpool-active canvas#c,
  body.whirlpool-active .light-rays-container {
    animation: scene-suction 1.8s cubic-bezier(0.55, 0, 0.45, 1) forwards;
    transform-origin: center center;
  }
  @keyframes scene-suction {
    0%   { transform: rotate(0deg)    scale(1);   filter: blur(0);    }
    40%  { filter: blur(3px); }
    100% { transform: rotate(720deg)  scale(2.2); filter: blur(18px); opacity: 0; }
  }


  /* ── CUSTOM LIGHT CURSOR ── */
  * { cursor: none !important; }
  #cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 8px 3px rgba(200, 170, 255, 0.9),
                0 0 20px 8px rgba(151, 95, 255, 0.5);
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, opacity 1s ease;
    opacity: 0;
  }
  #cursor-darkness {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 49;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #cursor-bloom {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 48;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
</style>
</head>
<body>

<!-- WAVE CARD — click to start the experience -->
<div class="card-overlay" id="cardOverlay">
  <div class="card" id="tiltContainer">
    <div class="card2">
      <canvas id="plankton-canvas"></canvas>
      <p class="card-title">Welcome</p>
      <p class="card-body"><span id="typewriter-text"></span><span class="cursor-blink">|</span></p>
      <p class="card-cta">click to Begin</p>
    </div>
  </div>
</div>
<div id="cursor-dot"></div>
<div id="cursor-darkness"></div>
<div id="cursor-bloom"></div>

<canvas id="c"></canvas>

<div id="drop-overlay">
  <div id="teardrop"></div>
</div>

<!-- WebGL light rays render target -->
<div id="lightRays" class="light-rays-container"></div>

<div class="stage">
  <p class="label">Interactive Simulation</p>
  <h1> Training an<br><span class="line2"><span class="line2-blue">Ecosystem</span> to Collapse</span></h1>
  <p class="sub">Exploring how reward systems influence behavior<br>and environmental change.</p>
  <div class="rule"></div>
  <button class="Btn" id="enterBtn">Start the Cycle</button>
</div>

<p class="hint"> &nbsp;·&nbsp; </p>

<div class="whirlpool-overlay" id="whirlpool"></div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
let rockFormations = [];
let coralPositions = [];
let reefTime = 0;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  initRockPositions();
  initCoralPositions();
}
resize();
window.addEventListener('resize', resize);

// ── GLOWING PLANKTON ──
const plankton = [];
const PLANKTON_COUNT = 55;
for (let i = 0; i < PLANKTON_COUNT; i++) {
  plankton.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: 0.8 + Math.random() * 1.5,
    speedX: (Math.random() - 0.5) * 0.3,
    speedY: -0.05 - Math.random() * 0.25,
    phase: Math.random() * Math.PI * 2,
    freq: 0.4 + Math.random() * 0.8,
    hue: 160 + Math.random() * 60,
    alpha: 0.25 + Math.random() * 0.35,
    pulseSpeed: 0.02 + Math.random() * 0.03
  });
}

function drawPlankton(t) {
  plankton.forEach(p => {
    p.phase += p.pulseSpeed;
    p.x += p.speedX + Math.sin(p.phase * 0.7) * 0.2;
    p.y += p.speedY;
    if (p.y < -10) { p.y = H + 5; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 5;
    if (p.x > W + 10) p.x = -5;

    const pulse = 0.6 + 0.4 * Math.sin(p.phase);
    const glowR = p.r * (2.5 + pulse * 2);
    const alpha = p.alpha * pulse;

    // outer glow
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR * 3);
    g.addColorStop(0, `hsla(${p.hue}, 100%, 75%, ${alpha * 0.9})`);
    g.addColorStop(0.3, `hsla(${p.hue}, 100%, 65%, ${alpha * 0.4})`);
    g.addColorStop(1, `hsla(${p.hue}, 100%, 55%, 0)`);
    ctx.beginPath();
    ctx.arc(p.x, p.y, glowR * 3, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    // bright core
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue + 20}, 100%, 92%, ${alpha})`;
    ctx.fill();
  });
}

function initRockPositions() {
  rockFormations = [
    { x:80,  y:H-5, r:24, points:[0.9,1.1,0.8,1.2,0.95,0.85,1.05,1.1] },
    { x:140, y:H-5, r:18, points:[1.1,0.85,1.15,0.9,1.05,1.2,0.8,0.95] },
    { x:200, y:H-5, r:20, points:[0.95,1.15,0.9,1.1,1.05,0.8,1.2,0.85] },
    { x:250, y:H-5, r:22, points:[1.0,0.9,1.2,0.85,1.05,1.15,0.9,1.1] },
    { x:W-80,  y:H-5, r:30, points:[1.0,1.05,0.9,1.15,0.85,1.1,1.2,0.95] },
    { x:W-140, y:H-5, r:18, points:[0.95,1.15,0.9,1.1,1.05,0.8,1.2,0.85] },
    { x:W-200, y:H-5, r:20, points:[1.1,0.85,1.15,0.9,1.05,1.2,0.8,0.95] },
    { x:W-250, y:H-5, r:22, points:[1.0,0.9,1.2,0.85,1.05,1.15,0.9,1.1] }
  ];
}
function drawAquariumRocks() {
  rockFormations.forEach(rock => {
    ctx.beginPath();
    const steps = rock.points.length;
    for (let i=0;i<=steps;i++) {
      const angle=(i/steps)*Math.PI*2;
      const r=rock.r*rock.points[i%steps];
      const x=rock.x+r*Math.cos(angle), y=rock.y+r*Math.sin(angle)*0.7;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    const g=ctx.createLinearGradient(rock.x,rock.y-rock.r,rock.x,rock.y+rock.r);
    g.addColorStop(0,'#3a4454');g.addColorStop(0.5,'#242b35');g.addColorStop(1,'#12161c');
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1.5;ctx.stroke();
  });
}

function initCoralPositions() {
  coralPositions=[
    {x:80,  y:H-5},
    {x:200, y:H-10},
    {x:W-80,y:H-5}
  ];
}
function growAquariumCoral(x,y,length,angle,depth) {
  if(depth>5)return;
  const wave=Math.sin(reefTime+depth*0.8)*0.05;
  const ex=x+length*Math.cos(angle+wave),ey=y+length*Math.sin(angle+wave);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);
  ctx.lineCap='round';ctx.lineWidth=(6-depth)*2.5;
  ctx.strokeStyle=`rgb(${230-depth*15},${110+depth*15},${120+depth*5})`;ctx.stroke();
  const nl=length*0.75;
  growAquariumCoral(ex,ey,nl,angle-0.45,depth+1);
  growAquariumCoral(ex,ey,nl*0.85,angle+0.15,depth+1);
  growAquariumCoral(ex,ey,nl,angle+0.55,depth+1);
}
function drawAnemoneCoral(bx,by,count,maxL) {
  for(let i=0;i<count;i++){
    const sa=-Math.PI/2+(i/(count-1)-0.5)*1.2;
    const cm=Math.sin(reefTime*2+i)*15;
    const ex=bx+maxL*Math.cos(sa)+cm,ey=by+maxL*Math.sin(sa)+Math.cos(reefTime+i)*10;
    const cpx=bx+(maxL/2)*Math.cos(sa)-cm,cpy=by+(maxL/2)*Math.sin(sa);
    ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(cpx,cpy,ex,ey);
    ctx.lineCap='round';ctx.lineWidth=3;ctx.strokeStyle='rgb(130,240,160)';ctx.stroke();
    ctx.beginPath();ctx.fillStyle='#b0ffc0';ctx.arc(ex,ey,2,0,Math.PI*2);ctx.fill();
  }
}
function drawSunkenBoat() {
  ctx.save();
  const bx=W/2,by=H-12,s=3;
  ctx.beginPath();ctx.moveTo(bx,by);
  ctx.quadraticCurveTo(bx+25*s,by-25*s,bx+55*s,by-20*s);ctx.lineTo(bx+45*s,by-5*s);
  ctx.quadraticCurveTo(bx+20*s,by,bx,by);ctx.closePath();
  const hg=ctx.createLinearGradient(bx,by-25*s,bx+30*s,by);
  hg.addColorStop(0,'#2d3b32');hg.addColorStop(1,'#151c18');
  ctx.fillStyle=hg;ctx.fill();
  ctx.beginPath();ctx.moveTo(bx+20*s,by-15*s);ctx.lineTo(bx+5*s,by-55*s);
  ctx.lineTo(bx+8*s,by-55*s);ctx.lineTo(bx+24*s,by-15*s);ctx.fillStyle='#1c2420';ctx.fill();
  ctx.beginPath();ctx.moveTo(bx+6*s,by-50*s);
  const sr=Math.sin(reefTime*1.2)*3*s;
  ctx.quadraticCurveTo(bx-8*s+sr,by-35*s,bx-2*s,by-25*s);
  ctx.quadraticCurveTo(bx+8*s,by-28*s,bx+16*s,by-25*s);
  ctx.closePath();ctx.fillStyle='rgba(45,60,52,0.4)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.8;ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();
  ctx.arc(bx+20*s,by-10*s,2*s,0,Math.PI*2);ctx.arc(bx+35*s,by-12*s,2*s,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function growSeaFan(x,y,length,angle,depth) {
  if(depth>6)return;
  const ss=Math.sin(reefTime*0.5+depth)*0.01;
  const ex=x+length*Math.cos(angle+ss),ey=y+length*Math.sin(angle+ss);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);
  ctx.lineCap='square';ctx.lineWidth=Math.max(1,4-depth*0.5);
  ctx.strokeStyle=`rgb(${160+depth*10},60,${180-depth*10})`;ctx.stroke();
  const nl=length*0.8;growSeaFan(ex,ey,nl,angle-0.3,depth+1);growSeaFan(ex,ey,nl,angle+0.3,depth+1);
}
function drawTallEelgrass(startX,plantHeight,leafWidth) {
  ctx.save();ctx.beginPath();ctx.moveTo(startX,H-10);
  const segments=15,pts=[];
  for(let i=0;i<=segments;i++){
    const p=i/segments,y=(H-10)-plantHeight*p;
    const x=startX+Math.sin(reefTime*0.8+p*3)*(p*p*22);
    pts.push({x,y});
  }
  for(let i=0;i<pts.length;i++){const tw=leafWidth*(1-(i/pts.length)*0.5);ctx.lineTo(pts[i].x-tw/2,pts[i].y);}
  for(let i=pts.length-1;i>=0;i--){const tw=leafWidth*(1-(i/pts.length)*0.5);ctx.lineTo(pts[i].x+tw/2,pts[i].y);}
  ctx.closePath();
  const pg=ctx.createLinearGradient(startX,H,startX,H-plantHeight);
  pg.addColorStop(0,'rgba(34,110,63,0.75)');pg.addColorStop(0.7,'rgba(46,170,95,0.6)');pg.addColorStop(1,'rgba(120,220,150,0.4)');
  ctx.fillStyle=pg;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;ctx.stroke();ctx.restore();
}
function drawTallHairgrass(cx,cy,n,bh) {
  ctx.save();ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const bh2=bh-(i%4)*15,sx=cx+(i-n/2)*1.5;
    const sway=Math.sin(reefTime*2.5+i*0.2)*14,spread=(i-n/2)*3;
    ctx.beginPath();ctx.moveTo(sx,cy);
    ctx.quadraticCurveTo(sx+spread*0.5+sway*0.5,cy-bh2*0.5,sx+spread+sway,cy-bh2);
    ctx.strokeStyle=i%3===0?'rgba(140,240,150,0.8)':i%2===0?'rgba(46,170,95,0.8)':'rgba(20,100,50,0.8)';
    ctx.lineWidth=1.2;ctx.stroke();
  }
  ctx.restore();
}
function drawDriftwoodLog(cx,cy) {
  ctx.save();ctx.beginPath();
  ctx.moveTo(cx-40,cy+10);ctx.quadraticCurveTo(cx-10,cy-25,cx+50,cy-30);
  ctx.lineTo(cx+55,cy-15);ctx.quadraticCurveTo(cx,cy-10,cx-10,cy+2);ctx.closePath();
  const wg=ctx.createLinearGradient(cx,cy-30,cx,cy+2);
  wg.addColorStop(0,'#5a3d28');wg.addColorStop(0.6,'#3d2516');wg.addColorStop(1,'#21130a');
  ctx.fillStyle=wg;ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+15,cy-22);ctx.quadraticCurveTo(cx+30,cy-45,cx+45,cy-50);
  ctx.lineTo(cx+48,cy-45);ctx.quadraticCurveTo(cx+35,cy-38,cx+25,cy-19);ctx.fillStyle='#3d2516';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(cx-25,cy+2);ctx.quadraticCurveTo(cx+10,cy-8,cx+40,cy-13);
  ctx.moveTo(cx-10,cy+6);ctx.quadraticCurveTo(cx+20,cy-3,cx+45,cy-6);
  ctx.stroke();ctx.restore();
}
function drawAllCorals() {
  reefTime+=0.01;
  drawAquariumRocks();drawSunkenBoat();
  drawTallEelgrass(50,150,20);drawTallEelgrass(90,130,16);
  drawDriftwoodLog(70,H-5);
  coralPositions.forEach(pos=>growAquariumCoral(pos.x,pos.y,40,-Math.PI/2,0));
  growSeaFan(140,H-5,50,-Math.PI/2,0);
  growSeaFan(W-140,H-5,50,-Math.PI/2,0);
  drawAnemoneCoral(80,H-5,12,45);drawAnemoneCoral(W-80,H-5,12,45);
  drawAnemoneCoral(40,H-5,10,40);drawAnemoneCoral(140,H-5,11,42);
  drawDriftwoodLog(W*0.25,H-5);drawDriftwoodLog(W*0.75,H-5);
  drawTallHairgrass(W-60,H-5,12,140);drawTallHairgrass(W-120,H-5,10,120);
  ctx.fillStyle='#3a4454';ctx.beginPath();ctx.arc(W-60,H-10,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2d3b42';ctx.beginPath();ctx.arc(W-120,H-10,10,0,Math.PI*2);ctx.fill();
}

class Bubble {
  constructor() {
    this.x = Math.random()*W; this.y = H+20;
    this.r  = Math.random()*4+2;
    this.vy = Math.random()*1+0.5;
    this.w  = Math.random()*Math.PI*2;
    this.ws = Math.random()*0.03+0.01;
  }
  update() { this.y-=this.vy; this.w+=this.ws; this.x+=Math.sin(this.w)*0.5; }
  draw()   {
    ctx.fillStyle=`rgba(255,255,255,${0.2-this.y/H*0.15})`;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
  }
  dead()   { return this.y<-10; }
}

class Fish {
  constructor(anywhere) { this.spawn(anywhere); }
  spawn(anywhere) {
    this.size = Math.random()*20+12;
    this.fromLeft = Math.random()<0.5;
    this.x = anywhere ? Math.random()*W : (this.fromLeft ? -80 : W+80);
    this.y = Math.random()*(H*0.8)+H*0.05;
    const spd = Math.random()*0.6+0.25;
    this.vx = this.fromLeft ? spd : -spd;
    this.vy = (Math.random()-0.5)*0.3;
    this.angle = Math.atan2(this.vy,this.vx);
    this.color = `hsl(${Math.random()*360},70%,50%)`;
    this.tail=0; this.td=1;
    this.alpha = anywhere ? Math.random()*0.45+0.15 : 0;
    this.fadein = !anywhere;
  }
  update() {
    if(this.fadein){ this.alpha=Math.min(this.alpha+0.004,0.5); if(this.alpha>=0.5)this.fadein=false; }
    this.x+=this.vx; this.y+=this.vy;
    this.tail+=this.td*0.3; if(Math.abs(this.tail)>5)this.td*=-1;
    this.angle=Math.atan2(this.vy,this.vx);
    if(this.x<-100||this.x>W+100) this.spawn(false);
  }
  draw() {
    const s=this.size;
    ctx.save(); ctx.globalAlpha=this.alpha;
    ctx.translate(this.x,this.y); ctx.rotate(this.angle);
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.ellipse(0,0,s,s*0.55,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s*0.8,0);
    ctx.lineTo(-s*1.3,-s*0.45+this.tail);
    ctx.lineTo(-s*1.3, s*0.45+this.tail); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = this.alpha * 0.8;
    ctx.beginPath();
    ctx.moveTo(-s*0.1, -s*0.55);
    ctx.lineTo( s*0.3, -s*0.55);
    ctx.lineTo( s*0.1, -s*0.3);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo( s*0.0,  s*0.55);
    ctx.lineTo( s*0.3,  s*0.55);
    ctx.lineTo( s*0.15, s*0.35);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(s*0.3,-s*0.15,s*0.14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(s*0.34,-s*0.15,s*0.07,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

const bubbles = [];
const fishes  = Array.from({length:14},()=>new Fish(true));
let t=0;

function frame() {
  t += 0.01;
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,  'rgba(15,35,75,0.35)');
  g.addColorStop(0.5,'rgba(8,22,55,0.45)');
  g.addColorStop(1,  'rgba(3,10,25,0.6)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){
    const y=5+i*5+Math.sin(t*1.5+i*1.2)*3;
    const sg=ctx.createLinearGradient(0,0,W,0);
    sg.addColorStop(0,'transparent');
    sg.addColorStop(0.3+Math.sin(t+i)*0.15,`rgba(118,215,255,${0.035+i*0.008})`);
    sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg; ctx.fillRect(0,y,W,2);
  }
  try { drawAllCorals(); } catch(e){}
  if(bubbles.length<30&&Math.random()<0.28) bubbles.push(new Bubble());
  for(let i=bubbles.length-1;i>=0;i--){
    bubbles[i].update(); bubbles[i].draw();
    if(bubbles[i].dead()) bubbles.splice(i,1);
  }
  fishes.forEach(f=>{f.update();f.draw();});
  drawPlankton(reefTime);
  const v=ctx.createRadialGradient(W/2,H/2,H*0.1,W/2,H/2,H*0.85);
  v.addColorStop(0,'transparent');
  v.addColorStop(1,'rgba(0,0,5,0.45)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}

// ================================================================
// BEAT BUS — shared state so the techno scheduler can drive the
// light rays shader. Audio schedules punches in AudioContext time;
// the render loop ticks them down each frame.
// ================================================================
const beatBus = {
  baseRayLength:   2.0,
  baseLightSpread: 1.0,
  baseDistortion:  0.0,
  baseNoise:       0.0,
  baseSaturation:  1.0,
  baseHueShift:    0.0,

  punches: {
    rayLength: 0, lightSpread: 0, distortion: 0,
    noise: 0, saturation: 0, hueShift: 0, pulsating: 0
  },
  decay: {
    rayLength: 0.90, lightSpread: 0.92, distortion: 0.85,
    noise: 0.82, saturation: 0.88, hueShift: 0.94, pulsating: 0.96
  },

  scheduledPunches: [],
  schedule(when, name, amount) {
    this.scheduledPunches.push({ when, name, amount });
  },

  tick(acTime) {
    // Fire any scheduled punches whose time has arrived
    for (let i = this.scheduledPunches.length - 1; i >= 0; i--) {
      const p = this.scheduledPunches[i];
      if (acTime >= p.when) {
        if (this.punches[p.name] !== undefined) {
          this.punches[p.name] = Math.max(this.punches[p.name], p.amount);
        }
        this.scheduledPunches.splice(i, 1);
      }
    }
    // Decay
    for (const k in this.punches) this.punches[k] *= this.decay[k];
  },

  get rayLength()   { return this.baseRayLength   + this.punches.rayLength; },
  get lightSpread() { return this.baseLightSpread + this.punches.lightSpread; },
  get distortion()  { return this.baseDistortion  + this.punches.distortion; },
  get noise()       { return this.baseNoise       + this.punches.noise; },
  get saturation()  { return this.baseSaturation  + this.punches.saturation; },
  get hueShift()    { return this.baseHueShift    + this.punches.hueShift; },
  get pulsating()   { return this.punches.pulsating > 0.3 ? 1.0 : 0.0; }
};
window.beatBus = beatBus;

// ================================================================
// LIGHT RAYS — vanilla WebGL port of the React/OGL component
// Same shader, same uniforms, same defaults.
// ================================================================
(function initLightRays() {
  const config = {
    raysOrigin:     'top-center',
    raysColor:      '#ffffff',
    raysSpeed:      1.0,
    lightSpread:    1.0,
    rayLength:      2.0,
    pulsating:      false,
    fadeDistance:   1.0,
    saturation:     1.0,
    followMouse:    true,
    mouseInfluence: 0.1,
    noiseAmount:    0.0,
    distortion:     0.0
  };

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? [parseInt(m[1],16)/255, parseInt(m[2],16)/255, parseInt(m[3],16)/255] : [1,1,1];
  }

  function getAnchorAndDir(origin, w, h) {
    const outside = 0.2;
    switch (origin) {
      case 'top-left':      return { anchor:[0, -outside*h],            dir:[0, 1] };
      case 'top-right':     return { anchor:[w, -outside*h],            dir:[0, 1] };
      case 'left':          return { anchor:[-outside*w, 0.5*h],        dir:[1, 0] };
      case 'right':         return { anchor:[(1+outside)*w, 0.5*h],     dir:[-1, 0] };
      case 'bottom-left':   return { anchor:[0, (1+outside)*h],         dir:[0, -1] };
      case 'bottom-center': return { anchor:[0.5*w, (1+outside)*h],     dir:[0, -1] };
      case 'bottom-right':  return { anchor:[w, (1+outside)*h],         dir:[0, -1] };
      default:              return { anchor:[0.5*w, -outside*h],        dir:[0, 1] };
    }
  }

  const container = document.getElementById('lightRays');
  if (!container) return;

  const glCanvas = document.createElement('canvas');
  container.appendChild(glCanvas);

  const gl = glCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: true });
  if (!gl) {
    console.warn('WebGL not supported — light rays disabled');
    return;
  }

  const vertSrc = `
    attribute vec2 position;
    varying vec2 vUv;
    void main() {
      vUv = position * 0.5 + 0.5;
      gl_Position = vec4(position, 0.0, 1.0);
    }
  `;

  const fragSrc = `
    precision highp float;

    uniform float iTime;
    uniform vec2  iResolution;

    uniform vec2  rayPos;
    uniform vec2  rayDir;
    uniform vec3  raysColor;
    uniform float raysSpeed;
    uniform float lightSpread;
    uniform float rayLength;
    uniform float pulsating;
    uniform float fadeDistance;
    uniform float saturation;
    uniform vec2  mousePos;
    uniform float mouseInfluence;
    uniform float noiseAmount;
    uniform float distortion;
    uniform float hueShift;

    varying vec2 vUv;

    float noise(vec2 st) {
      return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
    }

    vec3 hsv2rgb(vec3 c) {
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }

    float rayStrength(vec2 raySource, vec2 rayRefDirection, vec2 coord,
                      float seedA, float seedB, float speed) {
      vec2 sourceToCoord = coord - raySource;
      vec2 dirNorm = normalize(sourceToCoord);
      float cosAngle = dot(dirNorm, rayRefDirection);

      float distortedAngle = cosAngle + distortion * sin(iTime * 2.0 + length(sourceToCoord) * 0.01) * 0.2;

      float spreadFactor = pow(max(distortedAngle, 0.0), 1.0 / max(lightSpread, 0.001));

      float distance = length(sourceToCoord);
      float maxDistance = iResolution.x * rayLength;
      float lengthFalloff = clamp((maxDistance - distance) / maxDistance, 0.0, 1.0);

      float fadeFalloff = clamp((iResolution.x * fadeDistance - distance) / (iResolution.x * fadeDistance), 0.5, 1.0);
      float pulse = pulsating > 0.5 ? (0.8 + 0.2 * sin(iTime * speed * 3.0)) : 1.0;

      float baseStrength = clamp(
        (0.45 + 0.15 * sin(distortedAngle * seedA + iTime * speed)) +
        (0.3 + 0.2 * cos(-distortedAngle * seedB + iTime * speed)),
        0.0, 1.0
      );

      return baseStrength * lengthFalloff * fadeFalloff * spreadFactor * pulse;
    }

    void main() {
      vec2 fragCoord = gl_FragCoord.xy;
      vec2 coord = vec2(fragCoord.x, iResolution.y - fragCoord.y);

      vec2 finalRayDir = rayDir;
      if (mouseInfluence > 0.0) {
        vec2 mouseScreenPos = mousePos * iResolution.xy;
        vec2 mouseDirection = normalize(mouseScreenPos - rayPos);
        finalRayDir = normalize(mix(rayDir, mouseDirection, mouseInfluence));
      }

      vec4 rays1 = vec4(1.0) *
                   rayStrength(rayPos, finalRayDir, coord, 36.2214, 21.11349, 1.5 * raysSpeed);
      vec4 rays2 = vec4(1.0) *
                   rayStrength(rayPos, finalRayDir, coord, 22.3991, 18.0234, 1.1 * raysSpeed);

      vec4 fragColor = rays1 * 0.5 + rays2 * 0.4;

      if (noiseAmount > 0.0) {
        float n = noise(coord * 0.01 + iTime * 0.1);
        fragColor.rgb *= (1.0 - noiseAmount + noiseAmount * n);
      }

      float brightness = 1.0 - (coord.y / iResolution.y);

      // Rainbow color based on horizontal position, slowly drifting, blended with white
      float hue = mod(coord.x / iResolution.x + iTime * 0.04 + hueShift, 1.0);
      vec3 rainbow = hsv2rgb(vec3(hue, 0.85, 1.0));
      vec3 tint = mix(vec3(1.0), rainbow, 0.4);
      fragColor.rgb *= tint * (0.4 + brightness * 0.6);

      if (saturation != 1.0) {
        float gray = dot(fragColor.rgb, vec3(0.299, 0.587, 0.114));
        fragColor.rgb = mix(vec3(gray), fragColor.rgb, saturation);
      }

      fragColor.rgb *= raysColor;
      gl_FragColor = fragColor;
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error('Shader compile error:', gl.getShaderInfoLog(sh));
      gl.deleteShader(sh);
      return null;
    }
    return sh;
  }

  const vs = compile(gl.VERTEX_SHADER, vertSrc);
  const fs = compile(gl.FRAGMENT_SHADER, fragSrc);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error('Program link error:', gl.getProgramInfoLog(program));
    return;
  }
  gl.useProgram(program);

  // Fullscreen triangle
  const positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const positionLoc = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(positionLoc);
  gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

  // Uniform locations
  const u = {
    iTime:          gl.getUniformLocation(program, 'iTime'),
    iResolution:    gl.getUniformLocation(program, 'iResolution'),
    rayPos:         gl.getUniformLocation(program, 'rayPos'),
    rayDir:         gl.getUniformLocation(program, 'rayDir'),
    raysColor:      gl.getUniformLocation(program, 'raysColor'),
    raysSpeed:      gl.getUniformLocation(program, 'raysSpeed'),
    lightSpread:    gl.getUniformLocation(program, 'lightSpread'),
    rayLength:      gl.getUniformLocation(program, 'rayLength'),
    pulsating:      gl.getUniformLocation(program, 'pulsating'),
    fadeDistance:   gl.getUniformLocation(program, 'fadeDistance'),
    saturation:     gl.getUniformLocation(program, 'saturation'),
    mousePos:       gl.getUniformLocation(program, 'mousePos'),
    mouseInfluence: gl.getUniformLocation(program, 'mouseInfluence'),
    noiseAmount:    gl.getUniformLocation(program, 'noiseAmount'),
    distortion:     gl.getUniformLocation(program, 'distortion'),
    hueShift:       gl.getUniformLocation(program, 'hueShift')
  };

  // Static uniforms
  const colorRGB = hexToRgb(config.raysColor);
  gl.uniform3f(u.raysColor, colorRGB[0], colorRGB[1], colorRGB[2]);
  gl.uniform1f(u.raysSpeed,      config.raysSpeed);
  gl.uniform1f(u.lightSpread,    config.lightSpread);
  gl.uniform1f(u.rayLength,      config.rayLength);
  gl.uniform1f(u.pulsating,      config.pulsating ? 1.0 : 0.0);
  gl.uniform1f(u.fadeDistance,   config.fadeDistance);
  gl.uniform1f(u.saturation,     config.saturation);
  gl.uniform1f(u.mouseInfluence, config.mouseInfluence);
  gl.uniform1f(u.noiseAmount,    config.noiseAmount);
  gl.uniform1f(u.distortion,     config.distortion);
  gl.uniform1f(u.hueShift,       0.0);

  const mouse       = { x: 0.5, y: 0.5 };
  const smoothMouse = { x: 0.5, y: 0.5 };

  function resizeGL() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const wCSS = container.clientWidth;
    const hCSS = container.clientHeight;
    const w = Math.floor(wCSS * dpr);
    const h = Math.floor(hCSS * dpr);
    if (glCanvas.width !== w || glCanvas.height !== h) {
      glCanvas.width  = w;
      glCanvas.height = h;
      glCanvas.style.width  = wCSS + 'px';
      glCanvas.style.height = hCSS + 'px';
    }
    gl.viewport(0, 0, w, h);
    gl.uniform2f(u.iResolution, w, h);
    const { anchor, dir } = getAnchorAndDir(config.raysOrigin, w, h);
    gl.uniform2f(u.rayPos, anchor[0], anchor[1]);
    gl.uniform2f(u.rayDir, dir[0],    dir[1]);
  }
  window.addEventListener('resize', resizeGL);
  resizeGL();

  if (config.followMouse) {
    window.addEventListener('mousemove', e => {
      const rect = container.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) / rect.width;
      mouse.y = (e.clientY - rect.top)  / rect.height;
    });
  }

  function render(timeMS) {
    gl.uniform1f(u.iTime, timeMS * 0.001);

    // Sync visuals to the techno beat
    if (window.beatBus && landingCtx) {
      window.beatBus.tick(landingCtx.currentTime);
      gl.uniform1f(u.rayLength,   window.beatBus.rayLength);
      gl.uniform1f(u.lightSpread, window.beatBus.lightSpread);
      gl.uniform1f(u.distortion,  window.beatBus.distortion);
      gl.uniform1f(u.noiseAmount, window.beatBus.noise);
      gl.uniform1f(u.saturation,  window.beatBus.saturation);
      gl.uniform1f(u.hueShift,    window.beatBus.hueShift);
      gl.uniform1f(u.pulsating,   window.beatBus.pulsating);
    }

    if (config.followMouse && config.mouseInfluence > 0.0) {
      const smoothing = 0.92;
      smoothMouse.x = smoothMouse.x * smoothing + mouse.x * (1 - smoothing);
      smoothMouse.y = smoothMouse.y * smoothing + mouse.y * (1 - smoothing);
      gl.uniform2f(u.mousePos, smoothMouse.x, smoothMouse.y);
    }

    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();

let landingCtx = null;
function getLCtx() {
  if (!landingCtx) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        console.error('❌ Web Audio API not supported in this browser');
        return null;
      }
      landingCtx = new AudioCtx();
      console.log('✅ AudioContext created - State:', landingCtx.state);
      console.log('Sample Rate:', landingCtx.sampleRate);
      console.log('Destination:', landingCtx.destination);
    } catch (e) {
      console.error('❌ Failed to create AudioContext:', e.message);
      return null;
    }
  }
  return landingCtx;
}

function lWaterTone(startF, endF, vol, dur, delay=0) {
  const ac  = getLCtx();
  const osc = ac.createOscillator();
  const g   = ac.createGain();
  const lp  = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 1400;
  osc.type = 'sine';
  osc.frequency.setValueAtTime(startF, ac.currentTime + delay);
  osc.frequency.exponentialRampToValueAtTime(endF, ac.currentTime + delay + dur * 0.6);
  g.gain.setValueAtTime(0.001, ac.currentTime + delay);
  g.gain.linearRampToValueAtTime(vol, ac.currentTime + delay + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + dur);
  osc.connect(lp); lp.connect(g); g.connect(ac.destination);
  osc.start(ac.currentTime + delay);
  osc.stop(ac.currentTime + delay + dur + 0.05);
}

function lNoise(dur, freq, q, vol) {
  const ac  = getLCtx();
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d   = buf.getChannelData(0);
  for (let i=0; i<len; i++) d[i] = Math.random()*2-1;
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(); src.stop(ac.currentTime + dur + 0.05);
}

function playHoverTone() {
  lWaterTone(520, 200, 0.1, 0.2);
  lNoise(0.04, 2200, 3, 0.04);
}

// ── PORTHOLE HOVER SOUND — bubbles ──
function playBubbles() {
  const ac = landingCtx;
  if (!ac || ac.state !== 'running') return;
  [0, 60, 130, 210].forEach((ms, i) => {
    setTimeout(() => {
      const osc = ac.createOscillator();
      const g   = ac.createGain();
      const f   = 200 + i * 55;
      osc.type  = 'sine';
      osc.frequency.setValueAtTime(f, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(f * 2.8, ac.currentTime + 0.12);
      g.gain.setValueAtTime(0.001, ac.currentTime);
      g.gain.linearRampToValueAtTime(0.12 - i * 0.02, ac.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
      osc.connect(g); g.connect(ac.destination);
      osc.start(ac.currentTime);
      osc.stop(ac.currentTime + 0.18);
    }, ms);
  });
}

// ── TYPEWRITER EFFECT ──
(function() {
  const text    = 'A new ecosystem is waiting.';
  const el      = document.getElementById('typewriter-text');
  const cursor  = document.querySelector('.cursor-blink');
  const card    = document.getElementById('tiltContainer');
  let timer     = null;
  let charIdx   = 0;
  let typing    = false;

  function startTyping() {
    if (typing) return;
    typing  = true;
    charIdx = 0;
    el.textContent = '';
    cursor.classList.add('active');

    function typeChar() {
      if (charIdx < text.length) {
        el.textContent += text[charIdx];
        charIdx++;
        const delay = text[charIdx - 1] === '.' ? 420 : 42 + Math.random() * 35;
        timer = setTimeout(typeChar, delay);
      } else {
        setTimeout(() => { cursor.classList.remove('active'); }, 1800);
        typing = false;
      }
    }
    timer = setTimeout(typeChar, 280);
  }

  function resetTyping() {
    clearTimeout(timer);
    typing = false;
    charIdx = 0;
    el.textContent = '';
    cursor.classList.remove('active');
  }

  card.addEventListener('mouseenter', startTyping);
  card.addEventListener('mouseleave', resetTyping);

  // also hook into the demo-hover trigger
  const observer = new MutationObserver(() => {
    if (card.classList.contains('demo-hover')) {
      startTyping();
    } else {
      resetTyping();
    }
  });
  observer.observe(card, { attributes: true, attributeFilter: ['class'] });
})();

function playWhirlpoolSound() {
  const ac = getLCtx();
  if (!ac) return;
  const now = ac.currentTime;
  const dur = 1.8;

  // Whooshing water rush — filtered noise sweeping down in pitch
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = buf;

  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(2200, now);
  bp.frequency.exponentialRampToValueAtTime(180, now + dur);
  bp.Q.value = 5;

  const g = ac.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.45, now + 0.2);
  g.gain.linearRampToValueAtTime(0.001, now + dur);

  src.connect(bp); bp.connect(g); g.connect(ac.destination);
  src.start(now); src.stop(now + dur + 0.05);

  // Descending drain tone for vortex feel
  const osc = ac.createOscillator();
  const og = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(450, now);
  osc.frequency.exponentialRampToValueAtTime(45, now + dur);
  og.gain.setValueAtTime(0.001, now);
  og.gain.linearRampToValueAtTime(0.28, now + 0.25);
  og.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(og); og.connect(ac.destination);
  osc.start(now); osc.stop(now + dur + 0.05);

  // Rising shimmer for the spinning sensation
  const shimOsc = ac.createOscillator();
  const shimG = ac.createGain();
  const shimLp = ac.createBiquadFilter();
  shimLp.type = 'lowpass'; shimLp.frequency.value = 2400;
  shimOsc.type = 'triangle';
  shimOsc.frequency.setValueAtTime(180, now);
  shimOsc.frequency.exponentialRampToValueAtTime(900, now + dur * 0.8);
  shimG.gain.setValueAtTime(0.001, now);
  shimG.gain.linearRampToValueAtTime(0.12, now + 0.5);
  shimG.gain.exponentialRampToValueAtTime(0.001, now + dur);
  shimOsc.connect(shimLp); shimLp.connect(shimG); shimG.connect(ac.destination);
  shimOsc.start(now); shimOsc.stop(now + dur + 0.05);
}

function startUnderwaterAmbience(ac) {
  console.log('🌊 Starting underwater ambience synthesis...');
  const ambiMaster = ac.createGain();
  ambiMaster.gain.setValueAtTime(0, ac.currentTime);
  ambiMaster.gain.linearRampToValueAtTime(0.55, ac.currentTime + 4.0);
  ambiMaster.connect(ac.destination);

  function makeDeepHum() {
    const osc1=ac.createOscillator(), osc2=ac.createOscillator();
    const lfo=ac.createOscillator(), lfoG=ac.createGain();
    const g=ac.createGain(), lp=ac.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=180;
    osc1.type='sine'; osc1.frequency.value=42;
    osc2.type='sine'; osc2.frequency.value=47.3;
    lfo.type='sine'; lfo.frequency.value=0.07; lfoG.gain.value=6;
    lfo.connect(lfoG); lfoG.connect(osc1.frequency); lfoG.connect(osc2.frequency);
    g.gain.value=0.28;
    osc1.connect(lp); osc2.connect(lp); lp.connect(g); g.connect(ambiMaster);
    osc1.start(); osc2.start(); lfo.start();
  }
  makeDeepHum();

  function makeWaterColumn() {
    const osc=ac.createOscillator(), lfo=ac.createOscillator();
    const lfoG=ac.createGain(), bp=ac.createBiquadFilter(), g=ac.createGain();
    osc.type='sawtooth'; osc.frequency.value=28;
    lfo.type='sine'; lfo.frequency.value=0.13; lfoG.gain.value=3;
    bp.type='bandpass'; bp.frequency.value=110; bp.Q.value=8;
    g.gain.value=0.12;
    lfo.connect(lfoG); lfoG.connect(bp.frequency);
    osc.connect(bp); bp.connect(g); g.connect(ambiMaster);
    osc.start(); lfo.start();
  }
  makeWaterColumn();

  function makeUnderwaterWash() {
    const len=ac.sampleRate*6, buf=ac.createBuffer(1,len,ac.sampleRate);
    const d=buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<len;i++){
      const wh=Math.random()*2-1;
      b0=0.99886*b0+wh*0.0555179; b1=0.99332*b1+wh*0.0750759;
      b2=0.96900*b2+wh*0.1538520; b3=0.86650*b3+wh*0.3104856;
      b4=0.55000*b4+wh*0.5329522; b5=-0.7616*b5-wh*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+wh*0.5362)*0.11; b6=wh*0.115926;
    }
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp1=ac.createBiquadFilter(); lp1.type='lowpass'; lp1.frequency.value=320;
    const lp2=ac.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=180;
    const hp=ac.createBiquadFilter();  hp.type='highpass'; hp.frequency.value=18;
    const lfo=ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.04;
    const lfoG=ac.createGain(); lfoG.gain.value=0.06;
    const g=ac.createGain(); g.gain.value=0.18;
    lfo.connect(lfoG); lfoG.connect(g.gain);
    src.connect(hp); hp.connect(lp1); lp1.connect(lp2); lp2.connect(g); g.connect(ambiMaster);
    src.start(); lfo.start();
  }
  makeUnderwaterWash();

  function scheduleBubble() {
    const delay=Math.random()*3.2+0.4;
    setTimeout(()=>{
      const now=ac.currentTime, f=280+Math.random()*320, dur=0.08+Math.random()*0.14;
      const osc=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
      lp.type='lowpass'; lp.frequency.value=1600; osc.type='sine';
      osc.frequency.setValueAtTime(f,now);
      osc.frequency.exponentialRampToValueAtTime(f*1.7,now+dur*0.5);
      osc.frequency.exponentialRampToValueAtTime(f*0.5,now+dur);
      g.gain.setValueAtTime(0.001,now);
      g.gain.linearRampToValueAtTime(0.09+Math.random()*0.06,now+0.008);
      g.gain.exponentialRampToValueAtTime(0.001,now+dur);
      osc.connect(lp); lp.connect(g); g.connect(ambiMaster);
      osc.start(now); osc.stop(now+dur+0.05);
      const nlen=Math.floor(ac.sampleRate*(dur*0.4));
      const nbuf=ac.createBuffer(1,nlen,ac.sampleRate);
      const nd=nbuf.getChannelData(0); for(let i=0;i<nlen;i++) nd[i]=Math.random()*2-1;
      const nsrc=ac.createBufferSource(); nsrc.buffer=nbuf;
      const nbp=ac.createBiquadFilter(); nbp.type='bandpass'; nbp.frequency.value=f*1.2; nbp.Q.value=4;
      const ng=ac.createGain();
      ng.gain.setValueAtTime(0.04,now); ng.gain.exponentialRampToValueAtTime(0.001,now+dur*0.3);
      nsrc.connect(nbp); nbp.connect(ng); ng.connect(ambiMaster);
      nsrc.start(now); nsrc.stop(now+dur*0.4+0.05);
      scheduleBubble();
    }, delay*1000);
  }
  scheduleBubble(); scheduleBubble(); scheduleBubble();

  function makeRumble() {
    const osc=ac.createOscillator(), lfo=ac.createOscillator();
    const lfoG=ac.createGain(), g=ac.createGain(), lp=ac.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=60;
    osc.type='sine'; osc.frequency.value=22;
    lfo.type='sine'; lfo.frequency.value=0.03; lfoG.gain.value=8;
    g.gain.value=0.22;
    lfo.connect(lfoG); lfoG.connect(osc.frequency);
    osc.connect(lp); lp.connect(g); g.connect(ambiMaster);
    osc.start(); lfo.start();
  }
  makeRumble();

  function scheduleCreak() {
    setTimeout(()=>{
      const now=ac.currentTime, f=180+Math.random()*120;
      const osc=ac.createOscillator(), g=ac.createGain(), bp=ac.createBiquadFilter();
      bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=12;
      osc.type='sawtooth'; osc.frequency.value=f;
      osc.frequency.linearRampToValueAtTime(f*(0.85+Math.random()*0.3), now+1.2);
      g.gain.setValueAtTime(0.001,now);
      g.gain.linearRampToValueAtTime(0.06,now+0.3);
      g.gain.linearRampToValueAtTime(0.001,now+1.8);
      osc.connect(bp); bp.connect(g); g.connect(ambiMaster);
      osc.start(now); osc.stop(now+2.0);
      scheduleCreak();
    }, 6000+Math.random()*12000);
  }
  scheduleCreak();
}

function startDeepTechno() {
  try {
    const ac = getLCtx();
    if (!ac) return;

    const master = ac.createGain();
    master.gain.setValueAtTime(0, ac.currentTime);
    master.gain.linearRampToValueAtTime(0.7, ac.currentTime + 4.0);
    master.connect(ac.destination);

    // Subtle vinyl-style hiss for warmth
    (function makeHiss() {
      const len = ac.sampleRate * 4;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
      const src = ac.createBufferSource();
      src.buffer = buf; src.loop = true;
      const hp = ac.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 5000;
      const g = ac.createGain(); g.gain.value = 0.01;
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start();
    })();

    // === SOUND DESIGN ===
    function kick(when) {
      const osc = ac.createOscillator();
      const g   = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(85, when);
      osc.frequency.exponentialRampToValueAtTime(38, when + 0.12);
      g.gain.setValueAtTime(0.001, when);
      g.gain.linearRampToValueAtTime(0.9, when + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.35);
      osc.connect(g); g.connect(master);
      osc.start(when); osc.stop(when + 0.38);
      // attack click
      const click = ac.createOscillator();
      const cg    = ac.createGain();
      click.type = 'triangle';
      click.frequency.value = 1100;
      cg.gain.setValueAtTime(0.25, when);
      cg.gain.exponentialRampToValueAtTime(0.001, when + 0.012);
      click.connect(cg); cg.connect(master);
      click.start(when); click.stop(when + 0.015);
    }

    function subBass(when, dur, freq) {
      const osc = ac.createOscillator();
      const g   = ac.createGain();
      const lp  = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 180;
      osc.type = 'sine'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(0.3, when + 0.04);
      g.gain.setValueAtTime(0.3, when + dur - 0.08);
      g.gain.linearRampToValueAtTime(0, when + dur);
      osc.connect(lp); lp.connect(g); g.connect(master);
      osc.start(when); osc.stop(when + dur + 0.05);
    }

    function closedHat(when) {
      const len = Math.floor(ac.sampleRate * 0.04);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const hp  = ac.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 9000;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.16, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.035);
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(when); src.stop(when + 0.05);
    }

    function openHat(when) {
      const len = Math.floor(ac.sampleRate * 0.18);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const hp  = ac.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 7000;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.1, when);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.16);
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(when); src.stop(when + 0.2);
    }

    function clap(when) {
      [0, 0.012, 0.025, 0.045].forEach((off, i) => {
        const len = Math.floor(ac.sampleRate * 0.06);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const d   = buf.getChannelData(0);
        for (let j = 0; j < len; j++) d[j] = Math.random() * 2 - 1;
        const src = ac.createBufferSource(); src.buffer = buf;
        const bp  = ac.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = 1.4;
        const g = ac.createGain();
        const vol = i === 3 ? 0.22 : 0.12;
        const dur = i === 3 ? 0.09 : 0.025;
        g.gain.setValueAtTime(vol, when + off);
        g.gain.exponentialRampToValueAtTime(0.001, when + off + dur);
        src.connect(bp); bp.connect(g); g.connect(master);
        src.start(when + off); src.stop(when + off + dur + 0.02);
      });
    }

    function bassNote(when, freq) {
      const osc = ac.createOscillator();
      const g   = ac.createGain();
      const lp  = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 550; lp.Q.value = 6;
      osc.type = 'sawtooth'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.001, when);
      g.gain.linearRampToValueAtTime(0.13, when + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, when + 0.18);
      osc.connect(lp); lp.connect(g); g.connect(master);
      osc.start(when); osc.stop(when + 0.2);
    }

    function padNote(when, freq, dur) {
      const osc1 = ac.createOscillator();
      const osc2 = ac.createOscillator();
      const g    = ac.createGain();
      const lp   = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 900;
      osc1.type = 'sine'; osc1.frequency.value = freq;
      osc2.type = 'sine'; osc2.frequency.value = freq * 1.005;
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(0.045, when + 0.4);
      g.gain.setValueAtTime(0.045, when + dur - 0.4);
      g.gain.linearRampToValueAtTime(0, when + dur);
      osc1.connect(lp); osc2.connect(lp); lp.connect(g); g.connect(master);
      osc1.start(when); osc1.stop(when + dur + 0.05);
      osc2.start(when); osc2.stop(when + dur + 0.05);
    }

    // === TIMING ===
    const BPM  = 120;
    const BEAT = 60 / BPM;     // 0.5s
    const BAR  = BEAT * 4;     // 2s

    // === ARRANGEMENT — when each element enters ===
    const FROM = { kick: 0, sub: 0, cHat: 2, clap: 4, bass: 6, oHat: 8, pad: 10 };
    const DROP_INTERVAL = 16;

    // E minor pentatonic — E2=82.4, G2=98, A2=110, B2=123.5
    const BASS_PATTERN = [82.4, 0, 0, 0, 82.4, 0, 98, 0, 82.4, 0, 0, 0, 110, 0, 98, 0];
    // E3 + B3 root + 5th pad
    const PAD_FREQS = [164.81, 246.94];

    function scheduleBar(t, barIdx) {
      // KICK — every beat
      if (barIdx >= FROM.kick) {
        for (let i = 0; i < 4; i++) {
          const when = t + i * BEAT;
          kick(when);
          // CLUB MODE — heavy ray punch on every kick
          beatBus.schedule(when, 'rayLength',   1.6);
          beatBus.schedule(when, 'lightSpread', 0.45);
          beatBus.schedule(when, 'saturation',  0.4);
        }
      }

      // SUB BASS — sustained
      if (barIdx >= FROM.sub) subBass(t, BAR, 41.2);

      // CLOSED HAT — offbeats (8ths)
      if (barIdx >= FROM.cHat) {
        for (let i = 0; i < 8; i++) {
          if (i % 2 === 1) {
            const when = t + i * BEAT * 0.5;
            closedHat(when);
            beatBus.schedule(when, 'noise', 0.06);
          }
        }
      }

      // CLAP — beats 2 and 4
      if (barIdx >= FROM.clap) {
        const c1 = t + BEAT, c2 = t + BEAT * 3;
        clap(c1); clap(c2);
        beatBus.schedule(c1, 'distortion', 0.4);
        beatBus.schedule(c2, 'distortion', 0.4);
        beatBus.schedule(c1, 'hueShift', 0.18);
        beatBus.schedule(c2, 'hueShift', 0.18);
      }

      // BASS LINE — 16ths
      if (barIdx >= FROM.bass) {
        for (let i = 0; i < 16; i++) {
          const f = BASS_PATTERN[i];
          if (f > 0) bassNote(t + i * BEAT * 0.25, f);
        }
      }

      // OPEN HAT — alternating bars, off-offbeats
      if (barIdx >= FROM.oHat && barIdx % 2 === 1) {
        openHat(t + BEAT * 1.5);
        openHat(t + BEAT * 3.5);
      }

      // PAD — sustained
      if (barIdx >= FROM.pad) {
        PAD_FREQS.forEach(f => padNote(t, f, BAR));
      }

      // DROP — every 16 bars, rays go wild
      if (barIdx > 0 && barIdx % DROP_INTERVAL === 0) {
        for (let i = 0; i < 4; i++) {
          const when = t + i * BEAT;
          beatBus.schedule(when, 'rayLength',   3.5);
          beatBus.schedule(when, 'lightSpread', 1.3);
          beatBus.schedule(when, 'distortion',  0.7);
          beatBus.schedule(when, 'pulsating',   1.0);
          beatBus.schedule(when, 'hueShift',    0.5);
          beatBus.schedule(when, 'saturation',  0.6);
          beatBus.schedule(when, 'noise',       0.2);
        }
      }
    }

    let barIdx = 0;
    let nextBar = ac.currentTime + 0.5;
    function tick() {
      while (nextBar < ac.currentTime + BAR * 2) {
        scheduleBar(nextBar, barIdx);
        nextBar += BAR;
        barIdx++;
      }
      setTimeout(tick, BAR * 500);
    }
    tick();
  } catch (e) {
    console.error('❌ Error in startDeepTechno:', e.message, e);
  }
}

// ── LIGHT CURSOR / SPOTLIGHT ──
(function() {
  const dot      = document.getElementById('cursor-dot');
  const darkness = document.getElementById('cursor-darkness');
  const bloom    = document.getElementById('cursor-bloom');
  let mx = window.innerWidth * 0.08, my = window.innerHeight * 0.12;
  let sx = mx, sy = my;
  let userTookOver = false;

  // Auto-demo: sweep the light around for 5 seconds on load
  const demoStart = performance.now();
  const demoDuration = 8000;
  // Center of figure-8 is middle of screen
  const cx = window.innerWidth  / 2;
  const cy = window.innerHeight / 2;

  function getDemoPos(t) {
    const progress = t / demoDuration;

    const endX = window.innerWidth  * 0.92;
    const endY = window.innerHeight * 0.88;

    if (progress < 0.8) {
      const p = progress / 0.8; // 0→1 within sweep phase

      // Simple sine wave sweeping left to right across the screen
      const x = window.innerWidth  * (0.08 + p * 0.84); // left to right
      const y = cy + Math.sin(p * Math.PI * 2.5) * window.innerHeight * 0.2;
      return { x, y };
    } else {
      // Glide to bottom-right corner
      const p    = (progress - 0.8) / 0.2;
      const ease = 1 - Math.pow(1 - p, 3);
      const lastX = window.innerWidth  * (0.08 + 0.84);
      const lastY = cy + Math.sin(Math.PI * 2.5) * window.innerHeight * 0.2;
      return {
        x: lastX + (endX - lastX) * ease,
        y: lastY + (endY - lastY) * ease
      };
    }
  }

  document.addEventListener('mousemove', e => {
    userTookOver = true;
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + 'px';
    dot.style.top  = my + 'px';
  });

  const _porthole = document.getElementById('tiltContainer');
  let _portholeHovered = false;

  (function loop() {
    const now = performance.now();
    const elapsed = now - demoStart;

    if (!userTookOver && elapsed < demoDuration) {
      // Drive target from demo path
      const p = getDemoPos(elapsed);
      mx = p.x; my = p.y;
      dot.style.left  = mx + 'px';
      dot.style.top   = my + 'px';
      dot.style.opacity = '1';
    }

    sx += (mx - sx) * 0.14;
    sy += (my - sy) * 0.14;

    // Check if smoothed cursor is over the porthole
    if (_porthole) {
      const r   = _porthole.getBoundingClientRect();
      const cx  = r.left + r.width  / 2;
      const cy  = r.top  + r.height / 2;
      const rad = r.width / 2;
      const inside = Math.hypot(sx - cx, sy - cy) < rad;
      if (inside && !_portholeHovered) {
        _portholeHovered = true;
        _porthole.classList.add('demo-hover');
        // trigger plankton
        const startEvt = new Event('mouseenter');
        _porthole.dispatchEvent(startEvt);
      } else if (!inside && _portholeHovered) {
        _portholeHovered = false;
        _porthole.classList.remove('demo-hover');
        const stopEvt = new Event('mouseleave');
        _porthole.dispatchEvent(stopEvt);
      }
    }

    // Dark overlay with a hard-edged hole where cursor is
    darkness.style.background = `radial-gradient(circle 380px at ${sx}px ${sy}px,
      transparent 0%,
      transparent 20%,
      rgba(3, 5, 15, 0.75) 58%,
      rgba(3, 5, 15, 0.98) 100%
    )`;

    // Cyan bioluminescent bloom on top using screen blend
    bloom.style.background = `radial-gradient(circle 220px at ${sx}px ${sy}px,
      rgba(120, 230, 255, 0.18) 0%,
      rgba(80, 190, 255, 0.10) 40%,
      transparent 100%
    )`;

    requestAnimationFrame(loop);
  })();

  // Grow dot on hover
  document.querySelectorAll('button, a').forEach(el => {
    el.addEventListener('mouseenter', () => {
      dot.style.width  = '18px';
      dot.style.height = '18px';
    });
    el.addEventListener('mouseleave', () => {
      dot.style.width  = '10px';
      dot.style.height = '10px';
    });
  });
})();

// ── CARD PLANKTON ──
(function() {
  const canvas = document.getElementById('plankton-canvas');
  const ctx    = canvas.getContext('2d');
  const card   = document.getElementById('tiltContainer');
  const card2  = canvas.parentElement;

  let W, H, animId;
  const particles = [];
  const COUNT = 48;

  function resize() {
    const r = card2.getBoundingClientRect();
    W = canvas.width  = r.width;
    H = canvas.height = r.height;
  }

  function spawn(forceBottom) {
    const big = Math.random() < 0.12; // occasional larger orb
    return {
      x:     Math.random() * W,
      y:     forceBottom ? H + Math.random() * 40 : Math.random() * H,
      r:     big ? 2.5 + Math.random() * 2 : 0.6 + Math.random() * 1.4,
      vx:    (Math.random() - 0.5) * 0.18,
      vy:    -(0.04 + Math.random() * 0.18),
      phase: Math.random() * Math.PI * 2,
      freq:  0.25 + Math.random() * 0.5,
      hue:   big ? 175 + Math.random() * 20 : 160 + Math.random() * 60,
      alpha: big ? 0.5 + Math.random() * 0.3 : 0.2 + Math.random() * 0.35,
      pulse: 0.012 + Math.random() * 0.02,
      big,
    };
  }

  function init() {
    resize();
    particles.length = 0;
    for (let i = 0; i < COUNT; i++) particles.push(spawn(false));
    initJellies();
  }

  // ── JELLYFISH ──
  const jellyfish = [];
  const JELLY_COUNT = 4;

  function spawnJelly(randomY) {
    const size = 22 + Math.random() * 28;
    return {
      x:      Math.random() * W,
      y:      randomY ? Math.random() * H : H + size * 3,
      size,
      hue:    Math.random() < 0.5 ? 185 + Math.random() * 30 : 280 + Math.random() * 40,
      alpha:  0.55 + Math.random() * 0.3,
      vy:     -(0.18 + Math.random() * 0.22),
      vx:     (Math.random() - 0.5) * 0.12,
      phase:  Math.random() * Math.PI * 2,
      pulseS: 0.018 + Math.random() * 0.012,
      tentacles: Array.from({ length: 6 + Math.floor(Math.random() * 5) }, (_, i) => ({
        offset: (i / (6 + Math.floor(Math.random() * 5))) * Math.PI * 2,
        length: size * (1.4 + Math.random() * 1.2),
        swing:  (Math.random() - 0.5) * 0.6,
        freq:   0.6 + Math.random() * 0.9,
        phase:  Math.random() * Math.PI * 2,
      })),
    };
  }

  function initJellies() {
    jellyfish.length = 0;
    for (let i = 0; i < JELLY_COUNT; i++) jellyfish.push(spawnJelly(true));
  }

  function drawJelly(j, t) {
    j.phase += j.pulseS;
    j.x += j.vx + Math.sin(j.phase * 0.4) * 0.18;
    j.y += j.vy;
    if (j.y < -j.size * 4) Object.assign(j, spawnJelly(false));
    if (j.x < -j.size) j.x = W + j.size;
    if (j.x > W + j.size) j.x = -j.size;

    const pulse = 0.85 + 0.15 * Math.sin(j.phase);
    const r     = j.size * pulse;
    const { x, y, hue, alpha } = j;

    ctx.save();
    ctx.globalAlpha = alpha;

    // — tentacles —
    j.tentacles.forEach(ten => {
      ten.phase += 0.02;
      const swayX = Math.sin(ten.phase * ten.freq + j.phase * 0.5) * ten.swing * r;
      ctx.beginPath();
      ctx.moveTo(x + Math.sin(ten.offset) * r * 0.55, y + r * 0.55);
      const cpx = x + Math.sin(ten.offset) * r * 0.55 + swayX;
      const cpy = y + r * 0.55 + ten.length * 0.5;
      const ex  = x + Math.sin(ten.offset) * r * 0.3 + swayX * 1.6;
      const ey  = y + r * 0.55 + ten.length;
      ctx.bezierCurveTo(cpx, cpy, cpx + swayX * 0.5, cpy + ten.length * 0.3, ex, ey);
      const tg = ctx.createLinearGradient(x, y + r * 0.55, ex, ey);
      tg.addColorStop(0, `hsla(${hue}, 90%, 72%, 0.7)`);
      tg.addColorStop(0.5, `hsla(${hue + 20}, 85%, 68%, 0.35)`);
      tg.addColorStop(1, `hsla(${hue + 30}, 80%, 65%, 0)`);
      ctx.strokeStyle = tg;
      ctx.lineWidth   = 1.2;
      ctx.lineCap     = 'round';
      ctx.stroke();
    });

    // — bell outer glow —
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    glow.addColorStop(0,   `hsla(${hue}, 100%, 75%, 0.22)`);
    glow.addColorStop(0.5, `hsla(${hue}, 90%, 65%, 0.08)`);
    glow.addColorStop(1,   `hsla(${hue}, 80%, 55%, 0)`);
    ctx.beginPath();
    ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // — bell body (dome) —
    ctx.beginPath();
    ctx.arc(x, y, r, Math.PI, 0); // top half
    ctx.closePath();
    const bellG = ctx.createRadialGradient(x - r * 0.25, y - r * 0.3, 0, x, y, r * 1.1);
    bellG.addColorStop(0,   `hsla(${hue + 20}, 100%, 88%, 0.75)`);
    bellG.addColorStop(0.4, `hsla(${hue},      95%, 72%, 0.55)`);
    bellG.addColorStop(0.8, `hsla(${hue - 10}, 85%, 60%, 0.35)`);
    bellG.addColorStop(1,   `hsla(${hue - 20}, 70%, 45%, 0.1)`);
    ctx.fillStyle = bellG;
    ctx.fill();

    // — frilly skirt rim —
    ctx.beginPath();
    const frills = 7;
    for (let i = 0; i <= frills; i++) {
      const angle = Math.PI + (i / frills) * Math.PI;
      const fr    = r * (i % 2 === 0 ? 1.05 : 0.88);
      const fx    = x + fr * Math.cos(angle);
      const fy    = y + fr * Math.sin(angle) * 0.55;
      i === 0 ? ctx.moveTo(fx, fy) : ctx.lineTo(fx, fy);
    }
    ctx.strokeStyle = `hsla(${hue + 10}, 90%, 80%, 0.45)`;
    ctx.lineWidth   = 1.8;
    ctx.stroke();

    // — inner organs / translucent ring —
    const orgG = ctx.createRadialGradient(x, y - r * 0.1, 0, x, y - r * 0.1, r * 0.55);
    orgG.addColorStop(0,   `hsla(${hue + 40}, 100%, 90%, 0.45)`);
    orgG.addColorStop(0.6, `hsla(${hue + 20}, 90%, 75%, 0.2)`);
    orgG.addColorStop(1,   `hsla(${hue},      80%, 60%, 0)`);
    ctx.beginPath();
    ctx.arc(x, y - r * 0.1, r * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = orgG;
    ctx.fill();

    // — specular highlight —
    const hlG = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, 0, x - r * 0.3, y - r * 0.35, r * 0.38);
    hlG.addColorStop(0,   `rgba(255,255,255,0.55)`);
    hlG.addColorStop(0.5, `rgba(255,255,255,0.12)`);
    hlG.addColorStop(1,   `rgba(255,255,255,0)`);
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.35, r * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = hlG;
    ctx.fill();

    ctx.restore();
  }

  // subtle caustic shimmer state
  let causticT = 0;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    causticT += 0.008;

    // faint caustic light bands from below
    for (let i = 0; i < 3; i++) {
      const cx = W * (0.2 + i * 0.3) + Math.sin(causticT + i * 1.2) * 30;
      const g = ctx.createRadialGradient(cx, H, 0, cx, H * 0.5, H * 0.8);
      g.addColorStop(0,   `rgba(0,160,255,0.04)`);
      g.addColorStop(0.5, `rgba(0,120,200,0.02)`);
      g.addColorStop(1,   `rgba(0,0,0,0)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // draw jellyfish
    jellyfish.forEach(j => drawJelly(j, causticT));

    particles.forEach(p => {
      p.phase += p.pulse;
      p.x += p.vx + Math.sin(p.phase * 0.6) * 0.22;
      p.y += p.vy;

      if (p.y < -20) { Object.assign(p, spawn(true)); return; }
      if (p.x < -10) p.x = W + 5;
      if (p.x > W + 10) p.x = -5;

      const pulse = 0.55 + 0.45 * Math.sin(p.phase);
      const glow  = p.r * (p.big ? 9 : 6) * pulse;
      const alpha = p.alpha * pulse;

      // outer glow
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glow);
      g.addColorStop(0,   `hsla(${p.hue},100%,68%,${alpha})`);
      g.addColorStop(0.4, `hsla(${p.hue},100%,55%,${alpha * 0.35})`);
      g.addColorStop(1,   `hsla(${p.hue},100%,40%,0)`);
      ctx.beginPath();
      ctx.arc(p.x, p.y, glow, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();

      // bright core
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},100%,90%,${Math.min(alpha * 1.4, 0.95)})`;
      ctx.fill();
    });

    animId = requestAnimationFrame(draw);
  }

  function start() { init(); if (!animId) draw(); }
  function stop()  { cancelAnimationFrame(animId); animId = null; ctx.clearRect(0, 0, W, H); }

  card.addEventListener('mouseenter', start);
  card.addEventListener('mouseleave', stop);
  window.addEventListener('resize', () => { if (animId) resize(); });
})();

// ── PORTHOLE RIVETS ──
(function() {
  const card  = document.getElementById('tiltContainer');
  const COUNT = 20;
  const cx = 290, cy = 290, R = 272;
  for (let i = 0; i < COUNT; i++) {
    const angle = (i / COUNT) * Math.PI * 2 - Math.PI / 2;
    const x = cx + R * Math.cos(angle);
    const y = cy + R * Math.sin(angle);
    const dot = document.createElement('div');
    dot.className = 'rivet';
    dot.style.left = (x - 6) + 'px';
    dot.style.top  = (y - 6) + 'px';
    card.appendChild(dot);
  }

})();

(function() {
  const overlay = document.getElementById('cardOverlay');
  overlay.addEventListener('click', function onCardClick() {
    overlay.removeEventListener('click', onCardClick);

    // Start audio
    const ac = getLCtx();
    if (ac) {
      const doStart = () => { if (!landingLofiStarted) startAudioSynthesis(ac); };
      if (ac.state === 'suspended') ac.resume().then(doStart);
      else doStart();
    }

    // Reveal background
    document.getElementById('c').style.opacity = '1';
    document.getElementById('lightRays').style.opacity = '1';
    document.getElementById('cursor-dot').style.opacity = '1';
    document.getElementById('cursor-darkness').style.opacity = '1';
    document.getElementById('cursor-bloom').style.opacity = '1';
    document.querySelector('.stage').style.opacity = '1';

    // Dismiss card
    overlay.classList.add('hidden');
  });
})();
</script>
