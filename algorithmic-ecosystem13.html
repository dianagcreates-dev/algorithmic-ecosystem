    function getCoralSnagPoints() {
        return [
            { x: 80,               y: canvas.height - 75 },
            { x: 200,              y: canvas.height - 80 },
            { x: 140,              y: canvas.height - 60 },
            { x: canvas.width-80,  y: canvas.height - 75 },
            { x: canvas.width-140, y: canvas.height - 60 },
            { x: canvas.width-200, y: canvas.height - 80 },
        ];
    }

    function drawSinkingItems() {
        const snagPoints = getCoralSnagPoints();

        for (let i=sinkingItems.length-1;i>=0;i--) {
            const item=sinkingItems[i];
            item.y += item.sinkSpeed;
            item.sinkSpeed = Math.min(item.sinkSpeed + 0.02, 2.5);
            item.rot = (item.rot||0) + 0.018;

            if (!item.snagged) {
                for (const snag of snagPoints) {
                    const dx = Math.abs(item.x - snag.x);
                    const dy = item.y - snag.y;
                    if (dx < 55 && dy >= 0 && dy < 12 && Math.random() < 0.35) {
                        item.snagged = true;
                        restingItems.push({
                            type:   item.type,
                            color:  item.color,
                            x:      snag.x + (Math.random()-0.5)*28,
                            y:      snag.y + (Math.random()-0.5)*12,
                            rot:    (Math.random()-0.5)*0.7,
                            tangled: true
                        });
                        sinkingItems.splice(i,1);
                        break;
                    }
                }
                if (item.snagged) continue;
            }

            if (item.y >= canvas.height - 32) {
                restingItems.push({
                    type:  item.type,
                    color: item.color,
                    x:     item.x + (Math.random()-0.5)*20,
                    y:     canvas.height - 18 - Math.random()*18,
                    rot:   (Math.random()-0.5)*1.0
                });
                sinkingItems.splice(i,1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha=1;
            ctx.translate(item.x, item.y);
            ctx.rotate(item.rot);
            drawItemShape(item.type, item.color);
            ctx.restore();
        }
    }

    function drawRestingItems() {
        restingItems.forEach(item => {
            ctx.save();
            ctx.globalAlpha = 0.82 * (item.opacity ?? 1);
            ctx.translate(item.x, item.y);
            ctx.rotate(item.rot);

            if (item.tangled) {
                ctx.strokeStyle = 'rgba(180,160,120,0.7)';
                ctx.lineWidth = 1.2;
                ctx.setLineDash([3,4]);
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.quadraticCurveTo(8, -25, 2, -42);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            drawItemShape(item.type, item.color);
            ctx.restore();
        });
    }

    function checkFishFoodCollision() {
        fishes.forEach(fish => {
            for (let j=foods.length-1;j>=0;j--) {
                const food=foods[j];
                if (Math.hypot(fish.x-food.x,fish.y-food.y) < fish.size+food.size) {
                    foods.splice(j,1);
                    fish.coins += 1;
                    fish.hunger = HUNGER_MAX;
                    floatingTexts.push({ x:fish.x, y:fish.y - fish.size*2, text:'+1💰', life:1.0, color:'#ffd700' });
                    const ms=4, cs=Math.hypot(fish.speedX,fish.speedY);
                    if (cs>0) { fish.speedX=(fish.speedX/cs)*Math.min(cs*1.5,ms); fish.speedY=(fish.speedY/cs)*Math.min(cs*1.5,ms); }
                    playSoundFoodDispense();
                }
            }
        });
    }

    function drawFloatingTexts() {
        for (let i = floatingTexts.length-1; i >= 0; i--) {
            const ft = floatingTexts[i];
            ft.y -= 0.8;
            ft.life -= 0.018;
            if (ft.life <= 0) { floatingTexts.splice(i,1); continue; }
            ctx.save();
            ctx.globalAlpha = ft.life;
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }
    }

    // ================================================================
    // POLLUTION METER
    // ================================================================
    let _pollBar=null, _pollText=null, _pollBox=null, _pollLastPct=-1;
    function drawPollutionMeter() {
        if (!_pollBar) {
            _pollBox  = document.querySelector('.progress-container');
            _pollBar  = document.querySelector('.progress-bar');
            _pollText = document.querySelector('.progress-text');
            if (!_pollBar) return;
        }
        const p = Math.max(0, Math.min(1, pollution));
        const pct = Math.round(p*100);
        if (pct === _pollLastPct) return;
        _pollLastPct = pct;

        _pollBar.style.height = pct + '%';
        _pollText.textContent = pct + '%';

        let r,g,b;
        if (p < 0.5) { const t=p/0.5;       r=80+(225-80)*t;  g=210+(200-210)*t; b=200+(70-200)*t; }
        else         { const t=(p-0.5)/0.5; r=225+(170-225)*t; g=200+(85-200)*t;  b=70+(40-70)*t;  }
        const c1 = `rgb(${r|0},${g|0},${b|0})`;
        const c2 = `rgb(${Math.max(0,(r|0)-45)},${Math.max(0,(g|0)-45)},${Math.max(0,(b|0)-35)})`;
        _pollBox.style.setProperty('--c1', c1);
        _pollBox.style.setProperty('--c2', c2);
        _pollBox.classList.toggle('critical', p > 0.65);
    }

    // ================================================================
    // STATUS PANEL
    // ================================================================

    // ================================================================
    // MAIN LOOP
    // ================================================================
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        frameCount++;

        const litter = restingItems.length + sinkingItems.length*0.5;
        const targetPollution = Math.min(litter / POLLUTION_FULL, 1);
        pollution += (targetPollution - pollution) * 0.05;
        if (frameCount - lastBuyFrame > HEAL_DELAY && restingItems.length > 0) {
            const it = restingItems[0];
            it.opacity = (it.opacity ?? 1) - 0.004;
            if (it.opacity <= 0) restingItems.shift();
        }

        drawBackground();

        if (bubbles.length<maxBubbles && Math.random()<0.3) bubbles.push(new Bubble());
        bubbles = bubbles.filter(b=>!b.isOffScreen());
        bubbles.forEach(b=>{ b.update(); b.draw(); });

        drawSeaweedParticles();

        foods = foods.filter(f=>!f.isOffScreen());
        foods.forEach(f=>{ f.update(); f.draw(); });

        drawRestingItems();
        updateDrawCrabs();
        updateDrawOctopus();

        jellies.forEach(j=>{ j.update(); j.draw(); });

        fishes.forEach(f=>{ f.update(); f.draw(); });
        checkFishFoodCollision();
        checkPredation();

        for (let i=fishes.length-1;i>=0;i--){
            const f = fishes[i];
            if (!f.dead) continue;
            if (!f.becameJelly && !f.eaten) {
                floatingTexts.push({ x:f.x, y:f.y - f.size*1.6, text:'💀', life:1.0, color:'#9aa' });
                for (let b=0;b<4;b++){ const bb=new Bubble(); bb.x=f.x+(Math.random()-0.5)*16; bb.y=f.y; bubbles.push(bb); }
                playSoundDeath();
            }
            fishes.splice(i,1);
        }

        if (fishes.length < MIN_FISH) {
            if (--respawnTimer <= 0) {
                const nf = new Fish({ size: 11, speedMultiplier: 1.4 });
                fishes.push(nf);
                floatingTexts.push({ x:nf.x, y:nf.y - nf.size*1.6, text:'✦', life:1.0, color:'#8fe' });
                respawnTimer = RESPAWN_DELAY;
            }
        } else {
            respawnTimer = RESPAWN_DELAY;
        }

        drawSinkingItems();
        drawFloatingTexts();
        drawPollutionMeter();

        latestHandLandmarks.forEach(lm => drawHandSkeleton(lm));

        requestAnimationFrame(animate);
    }

    // ================================================================
    // CRABS
    // ================================================================
    let crabs = [];

    class Crab {
        constructor() {
            this.reset(true);
        }
        reset(initial) {
            this.x = initial ? Math.random() * canvas.width : (Math.random() < 0.5 ? -40 : canvas.width + 40);
            this.y = canvas.height - 14;
            this.dir = this.x < canvas.width / 2 ? 1 : -1;
            this.speed = 0.4 + Math.random() * 0.5;
            this.size = 10 + Math.random() * 8;
            this.color = `hsl(${10 + Math.random() * 25},${70 + Math.random() * 20}%,${38 + Math.random() * 15}%)`;
            this.legPhase = Math.random() * Math.PI * 2;
            // Pause behaviour
            this.pauseTimer = 0;
            this.pauseDuration = 0;
            this.paused = false;
        }
        update() {
            this.legPhase += 0.18;

            if (this.paused) {
                this.pauseTimer--;
                if (this.pauseTimer <= 0) this.paused = false;
                return;
            }

            // Random pause
            if (Math.random() < 0.004) {
                this.paused = true;
                this.pauseTimer = 40 + Math.floor(Math.random() * 80);
                return;
            }

            // Random direction flip
            if (Math.random() < 0.006) this.dir *= -1;

            this.x += this.speed * this.dir;

            // Wrap off-screen
            if (this.x > canvas.width + 50 || this.x < -50) this.reset(false);
        }
        draw() {
            const s = this.size;
            ctx.save();
            ctx.translate(this.x, this.y);
            // flip horizontally when moving left
            ctx.scale(this.dir, 1);

            const lw = this.paused ? 0 : Math.sin(this.legPhase);

            // ── 6 walking legs ──
            ctx.strokeStyle = this.color;
            ctx.lineWidth = s * 0.13;
            ctx.lineCap = 'round';

            const legAngles = [-0.55, 0, 0.55];
            legAngles.forEach((baseAngle, i) => {
                const wave = (i % 2 === 0 ? 1 : -1) * lw * 0.25;
                // Bottom legs
                ctx.beginPath();
                ctx.moveTo(-s * 0.4 + i * s * 0.4, s * 0.15);
                ctx.lineTo(-s * 0.8 + i * s * 0.55, s * 0.5 + wave * s);
                ctx.lineTo(-s * 0.5 + i * s * 0.5, s * 0.85 + wave * s * 0.5);
                ctx.stroke();
            });

            // ── 2 claws ──
            // Front claw (bigger)
            ctx.beginPath();
            ctx.moveTo(s * 0.55, s * 0.1);
            ctx.lineTo(s * 1.1, -s * 0.1 + lw * s * 0.15);
            ctx.stroke();
            // Claw pincer top
            ctx.beginPath();
            ctx.moveTo(s * 1.1, -s * 0.1 + lw * s * 0.15);
            ctx.lineTo(s * 1.35, -s * 0.28 + lw * s * 0.1);
            ctx.stroke();
            // Claw pincer bottom
            ctx.beginPath();
            ctx.moveTo(s * 1.1, -s * 0.1 + lw * s * 0.15);
            ctx.lineTo(s * 1.3, s * 0.08 + lw * s * 0.1);
            ctx.stroke();

            // Back claw (smaller)
            ctx.beginPath();
            ctx.moveTo(-s * 0.55, s * 0.1);
            ctx.lineTo(-s * 0.9, -s * 0.05 - lw * s * 0.1);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-s * 0.9, -s * 0.05 - lw * s * 0.1);
            ctx.lineTo(-s * 1.1, -s * 0.2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-s * 0.9, -s * 0.05 - lw * s * 0.1);
            ctx.lineTo(-s * 1.05, s * 0.1);
            ctx.stroke();

            // ── Body (rounded rectangle shell) ──
            const bg = ctx.createRadialGradient(-s * 0.1, -s * 0.2, s * 0.1, 0, 0, s * 0.9);
            bg.addColorStop(0, lightenColor(this.color, 30));
            bg.addColorStop(1, this.color);
            ctx.fillStyle = bg;
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 0.75, s * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 0.8; ctx.stroke();

            // Shell ridge
            ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 0.7;
            ctx.beginPath(); ctx.ellipse(0, 0, s * 0.5, s * 0.33, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(0, 0, s * 0.25, s * 0.16, 0, 0, Math.PI * 2); ctx.stroke();

            // ── Eyes (two stalks on top) ──
            ctx.fillStyle = this.color;
            [-1, 1].forEach(side => {
                // Stalk
                ctx.beginPath();
                ctx.moveTo(side * s * 0.28, -s * 0.42);
                ctx.lineTo(side * s * 0.35, -s * 0.68);
                ctx.strokeStyle = this.color; ctx.lineWidth = s * 0.1; ctx.stroke();
                // Eyeball
                ctx.beginPath(); ctx.arc(side * s * 0.36, -s * 0.72, s * 0.13, 0, Math.PI * 2);
                ctx.fillStyle = '#111'; ctx.fill();
                // Shine
                ctx.beginPath(); ctx.arc(side * s * 0.33, -s * 0.75, s * 0.05, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fill();
            });

            ctx.restore();
        }
    }

    function lightenColor(hsl, amount) {
        // e.g. "hsl(15,80%,42%)" → lighten by amount%
        return hsl.replace(/(\d+)%\)$/, (_, l) => `${Math.min(100, parseInt(l) + amount)}%)`);
    }

    function initCrabs() {
        crabs = [];
        const count = 4 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) crabs.push(new Crab());
    }

    function updateDrawCrabs() {
        crabs.forEach(c => { c.update(); c.draw(); });
    }

    // ================================================================
    // OCTOPUS — crawls around coral bases on the seabed
    // ================================================================
    let octopus = null;

    // Waypoints: coral / rock x positions near the seabed the octopus visits
    function getOctopusWaypoints() {
        return [
            canvas.width * 0.08,
            canvas.width * 0.20,
            canvas.width * 0.35,
            canvas.width * 0.50,
            canvas.width * 0.65,
            canvas.width * 0.80,
            canvas.width * 0.92,
        ];
    }

    class Octopus {
        constructor() {
            this.size   = 22;
            this.color  = `hsl(${265 + Math.random()*30},60%,28%)`;
            this.y      = canvas.height - this.size * 0.6;
            this.phase  = 0;
            this.blinkTimer  = 150 + Math.floor(Math.random()*180);
            this.blinking    = false;
            this.blinkFrame  = 0;

            // Waypoint navigation
            const wps   = getOctopusWaypoints();
            this.wpIdx  = Math.floor(Math.random() * wps.length);
            this.x      = wps[this.wpIdx];
            this._pickNextWaypoint();

            // Arm tip positions — 8 arms each tracked as a segment chain
            this.arms = Array.from({length:8}, (_,i) => this._initArm(i));
        }

        _initArm(i) {
            const angle = Math.PI * (0.15 + (i / 7) * 0.7); // fan: ~27° to ~153° (spread along bottom)
            return {
                angle,
                phase: (i / 8) * Math.PI * 2,   // stagger wave
                // 4 segments per arm
                segs: Array.from({length:4}, (_,s) => ({
                    x: this.x + Math.cos(angle) * s * this.size * 0.7,
                    y: this.y  + Math.sin(angle) * s * this.size * 0.5,
                }))
            };
        }

        _pickNextWaypoint() {
            const wps = getOctopusWaypoints();
            let next;
            do { next = Math.floor(Math.random() * wps.length); } while (next === this.wpIdx && wps.length > 1);
            this.wpIdx   = next;
            this.targetX = wps[next];
            this.pausing = false;
            this.pauseTimer = 0;
        }

        update() {
            this.phase += 0.045;

            // Blink
            this.blinkTimer--;
            if (this.blinkTimer <= 0) { this.blinking = true; this.blinkFrame = 0; this.blinkTimer = 140 + Math.floor(Math.random()*200); }
            if (this.blinking) { this.blinkFrame++; if (this.blinkFrame > 12) this.blinking = false; }

            // Move toward waypoint
            if (this.pausing) {
                this.pauseTimer--;
                if (this.pauseTimer <= 0) this._pickNextWaypoint();
            } else {
                const dx = this.targetX - this.x;
                if (Math.abs(dx) < 2) {
                    // Arrived — pause at the coral
                    this.pausing    = true;
                    this.pauseTimer = 80 + Math.floor(Math.random() * 140);
                } else {
                    this.x += Math.sign(dx) * (0.5 + Math.abs(dx) * 0.012);
                }
            }

            // Update arm segments — each follows the previous with a wave
            this.arms.forEach((arm, ai) => {
                arm.phase += 0.03;
                const s  = this.size;
                const moving = !this.pausing;

                // Base angle fans from body, flips with direction of travel
                const dir    = this.targetX > this.x ? 1 : -1;
                const spread = (ai / 7 - 0.5) * Math.PI * 0.85; // –76° to +76°
                const baseA  = Math.PI * 0.5 + spread;           // pointing downward/outward

                arm.segs[0].x = this.x;
                arm.segs[0].y = this.y;

                for (let si = 1; si < arm.segs.length; si++) {
                    const prev = arm.segs[si - 1];
                    const segLen  = s * (0.72 - si * 0.06);       // taper
                    const wave    = Math.sin(arm.phase + si * 0.9) * (moving ? 0.32 : 0.12);
                    const angle   = baseA + wave;
                    arm.segs[si].x = prev.x + Math.cos(angle) * segLen;
                    arm.segs[si].y = Math.min(canvas.height - 4, prev.y + Math.sin(angle) * segLen * 0.55);
                }
            });
        }

        draw() {
            const s = this.size;
            ctx.save();

            // ── Draw 8 tentacles BEHIND body ──
            this.arms.forEach((arm, ai) => {
                const segs = arm.segs;
                if (segs.length < 2) return;

                // Smooth curve through segment points
                ctx.beginPath();
                ctx.moveTo(segs[0].x, segs[0].y);
                for (let si = 1; si < segs.length; si++) {
                    const prev = segs[si-1];
                    const curr = segs[si];
                    const mx   = (prev.x + curr.x) / 2;
                    const my   = (prev.y + curr.y) / 2;
                    ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
                }
                const last = segs[segs.length-1];
                ctx.lineTo(last.x, last.y);

                // Thickness tapers from base to tip
                const baseWidth = s * 0.28;
                ctx.lineWidth   = baseWidth;
                ctx.strokeStyle = this.color;
                ctx.lineCap     = 'round';
                ctx.lineJoin    = 'round';
                ctx.stroke();

                // Thinner lighter overlay for taper effect
                ctx.beginPath();
                ctx.moveTo(segs[1].x, segs[1].y);
                for (let si = 2; si < segs.length; si++) {
                    const prev = segs[si-1];
                    const curr = segs[si];
                    ctx.quadraticCurveTo(prev.x, prev.y, (prev.x+curr.x)/2, (prev.y+curr.y)/2);
                }
                ctx.lineTo(last.x, last.y);
                ctx.lineWidth   = s * 0.1;
                ctx.strokeStyle = lightenColor(this.color, 18);
                ctx.stroke();

                // Suckers along tentacle
                ctx.fillStyle = lightenColor(this.color, 30);
                for (let si = 1; si < segs.length; si++) {
                    const prev = segs[si-1];
                    const curr = segs[si];
                    const mx = (prev.x + curr.x) / 2;
                    const my = (prev.y + curr.y) / 2;
                    const r  = s * (0.06 - si * 0.01);
                    if (r > 1) {
                        ctx.beginPath();
                        ctx.arc(mx, my, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            // ── Mantle (body) — drawn on top of arm bases ──
            ctx.translate(this.x, this.y);

            const mg = ctx.createRadialGradient(-s*0.1, -s*0.4, s*0.05, 0, -s*0.15, s*0.75);
            mg.addColorStop(0, lightenColor(this.color, 32));
            mg.addColorStop(1, this.color);
            ctx.fillStyle = mg;
            ctx.beginPath();
            ctx.ellipse(0, -s*0.2, s*0.52, s*0.68, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1; ctx.stroke();

            // Mantle dome top
            ctx.beginPath();
            ctx.ellipse(0, -s*0.75, s*0.28, s*0.2, 0, 0, Math.PI*2);
            ctx.fillStyle = lightenColor(this.color, 14); ctx.fill();

            // Skin spots
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            [[-s*0.17,-s*0.22],[s*0.19,-s*0.08],[-s*0.06,-s*0.5],[s*0.14,-s*0.42]].forEach(([dx,dy]) => {
                ctx.beginPath(); ctx.arc(dx, dy, s*0.09, 0, Math.PI*2); ctx.fill();
            });

            // ── Eyes ──
            [-1,1].forEach(side => {
                const ex = side * s * 0.26, ey = -s * 0.16;
                ctx.beginPath(); ctx.arc(ex, ey, s*0.16, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,245,215,0.92)'; ctx.fill();
                if (!this.blinking) {
                    // Horizontal slit pupil
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, s*0.05, s*0.11, 0, 0, Math.PI*2);
                    ctx.fillStyle = '#180808'; ctx.fill();
                    ctx.beginPath(); ctx.arc(ex+s*0.04, ey-s*0.06, s*0.045, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(ex - s*0.13, ey); ctx.lineTo(ex + s*0.13, ey);
                    ctx.strokeStyle = '#180808'; ctx.lineWidth = 2; ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(ex, ey, s*0.16, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1; ctx.stroke();
            });

            ctx.restore();
        }
    }

    function initOctopus() {
        octopus = new Octopus();
    }

    function updateDrawOctopus() {
        if (!octopus) return;
        octopus.update();
        octopus.draw();
    }

    function initFishes(cfg={}) {
        fishes=[];
        for (let i=0;i<(cfg.count||8);i++) fishes.push(new Fish(cfg.fishConfig||{}));
    }

    canvas.addEventListener('click', e => foods.push(new Food(e.clientX, e.clientY)));

    // ================================================================
    // INIT
    // ================================================================
    initRockPositions();
    initCoralPositions();
    initPearlShells();
    initCrabs();
    initOctopus();
    initFishes();
    initSeaweedParticles();
    animate();

    const waitForMediaPipe = setInterval(() => {
        if (window.Hands) {
            clearInterval(waitForMediaPipe);
            initHandDetection();
        }
    }, 100);
    </script>

    <script>
    (function() {
      let _ac = null;
      function getAC() {
        if (!_ac) {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            _ac = new AudioCtx();
          } catch (e) { return null; }
        }
        return _ac;
      }

      function startUnderwaterAmbience() {
        try {
          const ac = getAC();
          if (!ac) return;
          const master = ac.createGain();
          master.gain.setValueAtTime(0, ac.currentTime);
          master.gain.linearRampToValueAtTime(0.55, ac.currentTime + 4.0);
          master.connect(ac.destination);

          (function makeDeepHum() {
            const osc1=ac.createOscillator(), osc2=ac.createOscillator();
            const lfo=ac.createOscillator(), lfoG=ac.createGain();
            const g=ac.createGain(), lp=ac.createBiquadFilter();
            lp.type='lowpass'; lp.frequency.value=180;
            osc1.type='sine'; osc1.frequency.value=42;
            osc2.type='sine'; osc2.frequency.value=47.3;
            lfo.type='sine'; lfo.frequency.value=0.07; lfoG.gain.value=6;
            lfo.connect(lfoG); lfoG.connect(osc1.frequency); lfoG.connect(osc2.frequency);
            g.gain.value=0.28;
            osc1.connect(lp); osc2.connect(lp); lp.connect(g); g.connect(master);
            osc1.start(); osc2.start(); lfo.start();
          })();

          (function makeWaterColumn() {
            const osc=ac.createOscillator(), lfo=ac.createOscillator();
            const lfoG=ac.createGain(), bp=ac.createBiquadFilter(), g=ac.createGain();
            osc.type='sawtooth'; osc.frequency.value=28;
            lfo.type='sine'; lfo.frequency.value=0.13; lfoG.gain.value=3;
            bp.type='bandpass'; bp.frequency.value=110; bp.Q.value=8; g.gain.value=0.12;
            lfo.connect(lfoG); lfoG.connect(bp.frequency);
            osc.connect(bp); bp.connect(g); g.connect(master);
            osc.start(); lfo.start();
          })();

          (function makeWash() {
            const len=ac.sampleRate*6, buf=ac.createBuffer(1,len,ac.sampleRate);
            const d=buf.getChannelData(0);
            let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
            for(let i=0;i<len;i++){
              const wh=Math.random()*2-1;
              b0=0.99886*b0+wh*0.0555179; b1=0.99332*b1+wh*0.0750759;
              b2=0.96900*b2+wh*0.1538520; b3=0.86650*b3+wh*0.3104856;
              b4=0.55000*b4+wh*0.5329522; b5=-0.7616*b5-wh*0.0168980;
              d[i]=(b0+b1+b2+b3+b4+b5+b6+wh*0.5362)*0.11; b6=wh*0.115926;
            }
            const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
            const lp1=ac.createBiquadFilter(); lp1.type='lowpass'; lp1.frequency.value=320;
            const lp2=ac.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=180;
            const hp=ac.createBiquadFilter();  hp.type='highpass'; hp.frequency.value=18;
            const lfo=ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.04;
            const lfoG=ac.createGain(); lfoG.gain.value=0.06;
            const g=ac.createGain(); g.gain.value=0.18;
            lfo.connect(lfoG); lfoG.connect(g.gain);
            src.connect(hp); hp.connect(lp1); lp1.connect(lp2); lp2.connect(g); g.connect(master);
            src.start(); lfo.start();
          })();

          function scheduleBubble() {
            setTimeout(function() {
              const now=ac.currentTime, f=280+Math.random()*320, dur=0.08+Math.random()*0.14;
              const osc=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
              lp.type='lowpass'; lp.frequency.value=1600; osc.type='sine';
              osc.frequency.setValueAtTime(f,now);
              osc.frequency.exponentialRampToValueAtTime(f*1.7,now+dur*0.5);
              osc.frequency.exponentialRampToValueAtTime(f*0.5,now+dur);
              g.gain.setValueAtTime(0.001,now);
              g.gain.linearRampToValueAtTime(0.09+Math.random()*0.06,now+0.008);
              g.gain.exponentialRampToValueAtTime(0.001,now+dur);
              osc.connect(lp); lp.connect(g); g.connect(master);
              osc.start(now); osc.stop(now+dur+0.05);
              const nlen=Math.floor(ac.sampleRate*dur*0.4);
              const nbuf=ac.createBuffer(1,nlen,ac.sampleRate);
              const nd=nbuf.getChannelData(0); for(let i=0;i<nlen;i++) nd[i]=Math.random()*2-1;
              const nsrc=ac.createBufferSource(); nsrc.buffer=nbuf;
              const nbp=ac.createBiquadFilter(); nbp.type='bandpass'; nbp.frequency.value=f*1.2; nbp.Q.value=4;
              const ng=ac.createGain();
              ng.gain.setValueAtTime(0.04,now); ng.gain.exponentialRampToValueAtTime(0.001,now+dur*0.3);
              nsrc.connect(nbp); nbp.connect(ng); ng.connect(master);
              nsrc.start(now); nsrc.stop(now+dur*0.4+0.05);
              scheduleBubble();
            }, (Math.random()*3.2+0.4)*1000);
          }
          scheduleBubble(); scheduleBubble(); scheduleBubble();

          (function makeRumble() {
            const osc=ac.createOscillator(), lfo=ac.createOscillator();
            const lfoG=ac.createGain(), g=ac.createGain(), lp=ac.createBiquadFilter();
            lp.type='lowpass'; lp.frequency.value=60;
            osc.type='sine'; osc.frequency.value=22;
            lfo.type='sine'; lfo.frequency.value=0.03; lfoG.gain.value=8; g.gain.value=0.22;
            lfo.connect(lfoG); lfoG.connect(osc.frequency);
            osc.connect(lp); lp.connect(g); g.connect(master);
            osc.start(); lfo.start();
          })();

          function scheduleCreak() {
            setTimeout(function() {
              const now=ac.currentTime, f=180+Math.random()*120;
              const osc=ac.createOscillator(), g=ac.createGain(), bp=ac.createBiquadFilter();
              bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=12;
              osc.type='sawtooth'; osc.frequency.value=f;
              osc.frequency.linearRampToValueAtTime(f*(0.85+Math.random()*0.3), now+1.2);
              g.gain.setValueAtTime(0.001,now);
              g.gain.linearRampToValueAtTime(0.06,now+0.3);
              g.gain.linearRampToValueAtTime(0.001,now+1.8);
              osc.connect(bp); bp.connect(g); g.connect(master);
              osc.start(now); osc.stop(now+2.0);
              scheduleCreak();
            }, 6000+Math.random()*12000);
          }
          scheduleCreak();
        } catch (e) {}
      }

      let started = false;
      function tryStart() {
        if (started) return;
        started = true;
        startUnderwaterAmbience();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(tryStart, 100));
      } else {
        setTimeout(tryStart, 100);
      }

      document.addEventListener('click',     tryStart, { once: true });
      document.addEventListener('keydown',   tryStart, { once: true });
      document.addEventListener('mousemove', tryStart, { once: true });
      document.addEventListener('touchstart',tryStart, { once: true });
    })();
    </script>
